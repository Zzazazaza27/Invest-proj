name: Архив окружения

# Окружение узла (Тэнк 15.11): подписанный архив окружения по утверждённому описанию
# infra/host/environment.json — только по команде, отдельно от CI выпуска:
#   gh workflow run hostenv.yml --ref main
# Подпись — ключом комплектов (окружение production), домен fifth-hostenv-v1. Артефакт —
# способ забрать архив, а не его хранение: архив сохраняется вне GitHub (ноутбук, затем копии
# узла) и закрепляется в infra/host/environment.lock.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostenv-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  archive:
    name: Сборка и подпись архива окружения
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Описание утверждено и полно
        run: |
          node --input-type=module -e '
            const { loadEnvironment } = await import("./scripts/lib/host-env.mjs");
            const { env, problems } = loadEnvironment("infra/host/environment.json");
            if (env.status !== "approved") { console.error("описание не утверждено (status: " + env.status + ")"); process.exit(1); }
            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          '
      - name: Сборка и подпись
        env:
          SIGN_KEY: ${{ secrets.KIT_SIGNING_KEY }}
        run: |
          umask 077
          mkdir -p hostenv-out
          printf '%s\n' "$SIGN_KEY" > "$RUNNER_TEMP/sign.pem"
          node scripts/host-env.mjs archive build --env infra/host/environment.json \
            --out hostenv-out --sign-key "$RUNNER_TEMP/sign.pem" | tee hostenv-out/build.json
          rm -f "$RUNNER_TEMP/sign.pem"
      - name: Проверка подписи открытым ключом
        env:
          SIGN_KEY: ${{ secrets.KIT_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGN_KEY" > "$RUNNER_TEMP/sign.pem"
          node -e 'const c=require("crypto");process.stdout.write(c.createPublicKey(require("fs").readFileSync(process.argv[1])).export({type:"spki",format:"pem"}))' "$RUNNER_TEMP/sign.pem" > "$RUNNER_TEMP/sign.pub"
          rm -f "$RUNNER_TEMP/sign.pem"
          node scripts/host-env.mjs archive verify hostenv-out/*.tar --pub "$RUNNER_TEMP/sign.pub"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostenv-${{ github.run_number }}
          path: hostenv-out/
          retention-days: 30
