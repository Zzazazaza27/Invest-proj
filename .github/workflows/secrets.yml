name: Секреты

# Раз в неделю и вручную (решение Томаса 10.11.2026: минуты Actions). На каждый push тот
# же скан идёт локально в хуке pre-push (.githooks/pre-push → scripts/check-secrets-pre-push.mjs:
# тот же образ по дайджесту и .gitleaks.toml) — до отправки. Здесь — полная история,
# страховка от отправки в обход хука.
on:
  # Понедельник, 06:15 по Москве — вслед за еженедельным CI.
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- гейт 2
  secrets-scan:
    name: Секрет-скан (ожидание 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Прямой запуск контейнера вместо gitleaks-action: action ожидает
      # results.sarif и лицензию для организаций, из-за чего падает на
      # приватном репозитории даже при отсутствии находок.
      #
      # Образ закреплён ДАЙДЖЕСТОМ, а не тегом. Тег `latest` подменяем: он
      # указывает на то, что владелец образа выложил последним, и гейт секретов
      # начал бы выполнять чужой неизвестный код при следующем прогоне без
      # единой правки в этом репозитории (SEC-18). Дайджест — единственная
      # неизменяемая ссылка. Соответствует v8.28.0.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
              --source=/repo --config=/repo/.gitleaks.toml \
              --no-banner --redact --exit-code 1
      # Приватные SSH-ключи не покидают локальную папку `.ssh/` (Ф58). Локально
      # то же держит хук pre-push, но он лежит в .git/hooks, не версионируется и
      # не переживает свежий клон — здесь проверка повторяется там, где её нельзя
      # обойти забывчивостью. Работа выбрана из-за `fetch-depth: 0` выше: без
      # полной истории проверка объектов видела бы один коммит. Установка
      # зависимостей не нужна — скрипт использует только встроенные модули Node
      # и git.
      - name: Гейт «ключи не покидают .ssh/»
        run: npm run gate:ssh-keys
