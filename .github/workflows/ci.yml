name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимальные права токена по умолчанию (принцип least privilege).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- гейт 1
  static:
    name: Линт, типы, формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint (включая границу «фронт не импортирует бэкенд»)
        run: npm run lint
      - name: TypeScript strict
        run: npm run typecheck

  # ---------------------------------------------------------------- гейт 2
  secrets-scan:
    name: Секрет-скан (ожидание 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- гейт 3
  sast:
    name: SAST semgrep (ожидание 0 ERROR)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@v4
      - name: Проектные правила + OWASP
        run: |
          semgrep scan \
            --config .semgrep/guardian.yml \
            --config p/typescript \
            --config p/nodejsscan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --sarif --output semgrep.sarif .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------------------------------------------------------- гейт 4
  deps:
    name: Аудит зависимостей (с транзитивом)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high и выше — блокирующе)
        run: npm audit --audit-level=high
      - name: Python-зависимости AI-контура
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r apps/ai-gateway/requirements.txt --strict || exit 1

  # ---------------------------------------------------------------- гейт 5
  database:
    name: Миграции + RLS-тесты на реальном PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: unicorn_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d unicorn_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Прогон миграций up на чистой БД
        run: npm run migrate -w database
      - name: Линтер миграций (expand/contract, FK/RLS/GRANT)
        run: npm run lint:migrations -w database
      - name: Негативные тесты RLS и конкурентные инварианты
        run: npm run test -w database

  # ---------------------------------------------------------------- гейт 6
  unit:
    name: Юнит и интеграционные тесты core
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: unicorn_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d unicorn_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run migrate -w database
      - run: npm run test -w apps/core

  # ---------------------------------------------------------------- гейт 7
  build:
    name: Сборка всех приложений
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
