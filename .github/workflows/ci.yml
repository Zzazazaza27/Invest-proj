name: CI

# Решение Томаса 05.11: полный CI раз в неделю, по понедельникам, а не на каждый push: запуски ели
# лимит и время, не находя опасного. Перед выпуском CI всё равно идёт целиком: комплект собирается
# только запуском по команде. Быстрые проверки и скан секретов держит хук pre-push, на GitHub
# секрет-скан — secrets.yml раз в неделю. 10.11.2026 (минуты Actions): и pull_request снят —
# только расписание и запуск по команде.
on:
  # Понедельник, 06:00 по Москве: к началу работы результат готов.
  schedule:
    - cron: '0 3 * * 1'
  # Комплект выпуска — по команде: gh workflow run ci.yml --ref main.
  workflow_dispatch:
    inputs:
      install:
        description: 'После комплекта выпустить на рабочую среду'
        type: boolean
        default: false
      expect:
        description: 'Ожидаемая текущая сборка рабочей среды'
        type: string
        default: ''

# Минимальные права токена по умолчанию (принцип least privilege).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Запуск по команде не отменяется: под ним может идти выпуск.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Версия по умолчанию для остальных гейтов. Диапазон, который проект
  # объявляет в `engines`, проверяется матрицей в гейте 1.
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- гейт 1
  static:
    name: Линт, типы, формат (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # ОБА конца объявленного диапазона `engines`. Раньше CI шёл только на 22,
    # а разработка велась на 24 — то есть версия, на которой пишется код,
    # гейтом не проверялась вовсе, и расхождение всплыло бы в проде (CODE-19).
    strategy:
      fail-fast: false
      matrix:
        # Одна версия — та, что в .nvmrc. Матрица из двух имела смысл, когда
        # над проектом работали с разных машин; сейчас разработчик один и
        # версия зафиксирована, а прогон шёл вдвое дольше на каждый push.
        # Вернуть вторую — одна строка, когда соберётесь мигрировать.
        node: ['22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Типы приложений выводятся из d.ts рабочих пакетов: без сборки
      # typecheck не находит @fifth/contracts и падает. Локально это не
      # видно — там dist уже лежит с прошлых сборок.
      - name: Сборка рабочих пакетов
        run: npm run build:packages
      - name: Prettier
        run: npm run format:check
      - name: ESLint (включая границу «фронт не импортирует бэкенд»)
        run: npm run lint
      - name: TypeScript strict
        run: npm run typecheck
      # Позитивный контроль: во фронтенд кладётся запрещённый импорт и
      # проверяется, что линтер его ловит. Без этого правило может тихо
      # перестать действовать, а заменяемость фронтенда — остаться на словах.
      - name: Граница фронт↔бэк работает (ADR-002)
        run: npm run gate:boundary
      # Реестр проверок обязан соответствовать коду: файлы, команды, сироты,
      # ссылки. Документ о тестах, разошедшийся с репозиторием, хуже его
      # отсутствия — на него ссылаются, принимая решения.
      - name: Целостность реестра проверок
        run: npm run check:registry
      # Статическая часть сетевого гейта: привязки портов в compose, анонимный
      # доступ к инфраструктуре, отключение проверки TLS, CORS с '*'.
      #
      # БЕЗ `--strict` намеренно: живого ядра в этом задании нет, и строгий
      # режим падал бы всегда. Зато число невыполненных проверок теперь печатается
      # отдельной строкой «не выполнено: N» — раньше они записывались как LOW и
      # тонули среди находок, а гейт объявлял себя пройденным (SEC-20).
      # Строгий режим (`npm run gate:net:strict`) входит в локальную цепочку
      # `npm run gate`, где периметр поднят. Перенос его в CI требует задания
      # с запущенным ядром — записано в TODO.
      - name: Сетевой гейт (статическая часть)
        run: npm run gate:net
      # Переиспользование секретов: в CI нет .env, проверяются плейсхолдеры
      # .env.example и fallback-значения docker-compose — копия примера «как
      # есть» не должна давать один пароль на несколько служб (Ф26).
      - name: Гейт переиспользования секретов
        run: npm run gate:secret-reuse
      # Согласованность KEK-доменов: тип KekDomain, вызовы seal*, карта ротации
      # и колонки *_wrapped_dek миграций не расходятся (Ф27). Живая часть
      # (пустота зарезервированных колонок) требует БД и идёт в локальном gate.
      - name: Гейт KEK-доменов (статическая часть)
        run: npm run gate:kek
      # Порядок серверного выпуска: перед contract-миграцией ядро остановлено,
      # удалённые сервисы отключены, после неё код не откатывается (2.1-W05).
      # Гоняется против имитации сервера — без сети и базы.
      - name: Проверка порядка выпуска
        run: npm run check:deploy-release
      # Согласованность списков логин-ролей БД: bootstrap-roles.ts, границы
      # ролей, CI env и .env.example не расходятся (Ф32, CODE-HIGH-01 —
      # роль app_archive появилась в коде, но CI не получил её пароль и URL).
      - name: Гейт согласованности ролей БД
        run: npm run gate:roles-env
      # Целостность SAST-конфига: guardian.yml обязан совпадать с HEAD и не
      # быть пустым (обнулялся четырежды; semgrep с пустым конфигом молча
      # прогоняет 0 правил). В CI checkout всегда из коммита, поэтому здесь
      # гейт держит инвариант «в коммите не пустой», а не ловит внешний процесс.
      - name: Гейт целостности SAST-конфига
        run: npm run gate:sast-config

  # ---------------------------------------------------------------- гейт 3
  sast:
    name: SAST semgrep (ожидание 0 ERROR)
    runs-on: ubuntu-latest
    container:
      # Дайджест соответствует 1.99.0. Тег в реестре можно перевесить на другой
      # образ; дайджест — нельзя (SEC-18).
      image: semgrep/semgrep@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ОГОВОРКА о неизменяемости. Сам semgrep закреплён дайджестом, а вот
      # наборы `p/...` разрешаются в реестре при каждом прогоне: их содержимое
      # может измениться без правки этого файла. Это принято осознанно —
      # застывший набор правил безопасности устаревает и перестаёт находить
      # новые классы дефектов, то есть цена «неизменяемости» здесь выше выгоды.
      # Проектные правила, на которых держится гейт, лежат в репозитории
      # (`.semgrep/guardian.yml`) и меняются только коммитом (SEC-18).
      - name: Проектные правила + OWASP
        run: |
          semgrep scan \
            --config .semgrep/guardian.yml \
            --config p/typescript \
            --config p/nodejsscan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --sarif --output semgrep.sarif .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------------------------------------------------------- гейт 4
  deps:
    name: Аудит зависимостей (с транзитивом)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Предупреждает, но не блокирует. Транзитивная уязвимость появляется без
      # единой правки кода — от новой advisory на пакет, которого мы даже не
      # выбирали. Блокирующий шаг в такой ситуации не защищает, а превращает
      # красный CI в норму, и тогда на него перестают смотреть вовсе.
      # Критические — по-прежнему останавливают: их мало и они того стоят.
      - name: npm audit (critical блокирует, high и ниже — предупреждение)
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning::Есть уязвимости уровня high — посмотрите npm audit"

      - name: Итог аудита в сводку
        if: always()
        run: |
          {
            echo "### Аудит зависимостей"
            echo ''
            echo '```'
            npm audit 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- гейт 5
  database:
    name: Миграции + RLS-тесты на реальном PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        # Дайджест соответствует pg16.
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: fifth_element_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d fifth_element_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/fifth_element_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/fifth_element_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Прогон миграций up на чистой БД
        run: npm run migrate -w database
      - name: Линтер миграций (expand/contract, FK/RLS/GRANT)
        run: npm run lint:migrations -w database
      # Логин-роли заводятся ДО тестов: rls.test.ts проверяет членство
      # app_backend_user в группах, и на пустой базе тест видел роль
      # несуществующей — «expected [] to deeply equal [app_backend,
      # app_public_read]». Шаг стоял после тестов с Ф18, из-за чего джоб падал
      # на каждом прогоне.
      # Постоянные гейты прав. Локально они прогонялись руками — то есть не
      # прогонялись на каждом изменении: расширить права сервисной роли или
      # выдать PUBLIC право на SECURITY DEFINER можно было незаметно для CI.
      - name: Логин-роли БД из переменных окружения
        run: npm run bootstrap:roles -w database
        env:
          DB_ROLE_PASSWORD_APP_BACKEND: ci_only_role_password_backend_00
          DB_ROLE_PASSWORD_APP_PUBLIC_READ: ci_only_role_password_public_00
          DB_ROLE_PASSWORD_APP_NOTIFICATIONS: ci_only_role_password_notify_00
          DB_ROLE_PASSWORD_APP_INTEGRATION: ci_only_role_password_integr_00
          DB_ROLE_PASSWORD_APP_READONLY: ci_only_role_password_readonly_0
          DB_ROLE_PASSWORD_APP_MAINTENANCE: ci_only_role_password_mainten_0
          DB_ROLE_PASSWORD_APP_AUTH: ci_only_role_password_authstate_0
          DB_ROLE_PASSWORD_APP_ARCHIVE: ci_only_role_password_archive_00
          DB_ROLE_PASSWORD_APP_RELEASE: ci_only_role_password_release_00
      - name: Негативные тесты RLS и конкурентные инварианты
        run: npm run test -w database
      - name: Права PUBLIC на функциях SECURITY DEFINER (ожидание 0 нарушений)
        run: node scripts/check-definer-privileges.mjs
      # Строки подключения собираются в шаге, а не лежат литералами: пароль
      # внутри URL — то самое, что запрещено в проекте и что ловит собственный
      # секрет-скан (он и поймал первую версию этого шага).
      - name: Границы сервисных ролей БД
        run: |
          host="localhost:5432/fifth_element_test"
          export DATABASE_URL="postgres://app_backend_user:${PW_BACKEND}@${host}"
          export DATABASE_URL_APP_NOTIFICATIONS="postgres://app_notifications_user:${PW_NOTIFY}@${host}"
          export DATABASE_URL_APP_INTEGRATION="postgres://app_integration_user:${PW_INTEGR}@${host}"
          export DATABASE_URL_APP_MAINTENANCE="postgres://app_maintenance_user:${PW_MAINTEN}@${host}"
          export DATABASE_URL_APP_AUTH="postgres://app_auth_user:${PW_AUTH}@${host}"
          export DATABASE_URL_APP_ARCHIVE="postgres://app_archive_user:${PW_ARCHIVE}@${host}"
          export DATABASE_URL_APP_RELEASE="postgres://app_release_user:${PW_RELEASE}@${host}"
          node scripts/check-service-roles.mjs
        env:
          PW_AUTH: ci_only_role_password_authstate_0
          PW_BACKEND: ci_only_role_password_backend_00
          PW_NOTIFY: ci_only_role_password_notify_00
          PW_INTEGR: ci_only_role_password_integr_00
          PW_MAINTEN: ci_only_role_password_mainten_0
          PW_ARCHIVE: ci_only_role_password_archive_00
          PW_RELEASE: ci_only_role_password_release_00

  # ---------------------------------------------------------------- гейт 6
  unit:
    name: Юнит и интеграционные тесты core
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        # Дайджест соответствует pg16.
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: fifth_element_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d fifth_element_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
      redis:
        # Дайджест соответствует 7.4-alpine.
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/fifth_element_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/fifth_element_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Тесты ядра резолвят @fifth/contracts через package.json main,
      # то есть требуют собранного пакета. Job запускает workspace напрямую,
      # минуя корневой скрипт test, поэтому сборка нужна здесь явно.
      - run: npm run build:packages
      - run: npm run migrate -w database
      # apps/core появляется в фазе Ф3.
      - name: Тесты core
        run: |
          if [ -f apps/core/package.json ]; then
            npm run test -w apps/core
          else
            echo "::notice::apps/core ещё не реализован (фаза Ф3). Тесты НЕ выполнялись."
          fi
      # Тесты ПАКЕТОВ до 2026-09-22 не запускал никто: это задание звало
      # только apps/core, задание database — только тесты схемы. 163
      # утверждения про договоры клиента и сервера, разбор разметки и клиент
      # API жили вне всякой автоматики, и зелёный CI о них ничего не говорил.
      - name: Тесты пакетов
        run: npm run test -w packages/contracts -w packages/ui -w packages/api-client

  # ---------------------------------------------------------------- гейт 7
  images:
    name: Сборка образов выпуска
    runs-on: ubuntu-latest
    needs: [static]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Сборка проверяется на каждом коммите, публикация — только при выпуске по команде.
      # Образы собираются один раз, здесь. Комплект берёт именно их по дайджесту:
      # задание kit ниже не пересобирает, а разрешает выпуск проверенного.
      - name: Сборка
        env:
          # Метка привязывает пакет GHCR к репозиторию: без неё токену CI отказано в записи.
          SOURCE: org.opencontainers.image.source=https://github.com/rebel-diesel/fifth-element
        run: |
          docker build --label "$SOURCE" --build-arg GIT_COMMIT=${{ github.sha }} -f infra/images/core.Dockerfile -t fifth/core:ci .
          docker build --label "$SOURCE" --build-arg GIT_COMMIT=${{ github.sha }} -f infra/images/web.Dockerfile -t fifth/web:ci .
          docker build --label "$SOURCE" -t fifth/postgres:ci infra/postgres
      - name: Образ ядра содержит сборку
        run: docker run --rm fifth/core:ci test -f apps/core/dist/main.js
      - name: Кандидаты в GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo '{}' > images.json
          for c in core web postgres; do
            ref="ghcr.io/rebel-diesel/fifth-element/$c:candidate-$ATTEMPT"
            docker tag "fifth/$c:ci" "$ref"
            # Дайджест — из ответа реестра: RepoDigests содержит и локальные имена.
            docker push "$ref" | tee push.log
            sum=$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | cut -d' ' -f2)
            digest="${ref%:*}@$sum"
            id=$(docker inspect --format '{{.Id}}' "$ref")
            test -n "$sum"
            jq --arg c "$c" --arg r "$ref" --arg d "$digest" --arg i "$id" \
              '.[$c] = {ref: $r, digest: $d, imageId: $i}' images.json > images.tmp
            mv images.tmp images.json
          done
      - name: Дайджесты кандидатов
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-${{ github.run_number }}.${{ github.run_attempt }}
          path: images.json
          retention-days: 7

  # Выпуск разрешается только после всех зелёных проверок. Образов здесь не собираем:
  # манифест ссылается на дайджесты задания images. Номер содержит попытку, поэтому
  # повторный запуск CI не занимает номер уже выпущенного комплекта.
  kit:
    name: Комплект выпуска
    runs-on: ubuntu-latest
    needs: [static, sast, deps, database, unit, build, images]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      BUILD: 2.1-b${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images-${{ github.run_number }}.${{ github.run_attempt }}
      - name: Номер свободен, метка сборки на те же образы
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in core web postgres; do
            tag="ghcr.io/rebel-diesel/fifth-element/$c:$BUILD"
            if docker manifest inspect "$tag" > /dev/null 2>&1; then
              echo "сборка $BUILD уже выпущена: $tag" >&2
              exit 1
            fi
            digest=$(jq -r --arg c "$c" '.[$c].digest' images.json)
            docker buildx imagetools create --tag "$tag" "$digest"
          done
      - name: Манифест
        run: |
          # Опись компонентов и отчёт лицензий этой сборки; суммы — в манифесте (блок 11).
          node scripts/sbom.mjs --out sbom --commit "${{ github.sha }}"
          node scripts/kit.mjs manifest --build "$BUILD" --commit "${{ github.sha }}" \
            --images images.json --out kit.json --sbom sbom
          cp infra/docker-compose.env.yml compose.yml
          mkdir prod-compose
          cp infra/docker-compose.yml infra/docker-compose.prod.yml infra/docker-compose.journald.yml prod-compose/
          # Дополнения Compose сборки (суммы в манифесте, поле overlays).
          mkdir overlays
          cp infra/docker-compose.env-production.yml infra/docker-compose.env-slots.yml \
            infra/docker-compose.env-journald.yml infra/docker-compose.secrets.yml \
            infra/docker-compose.tls.yml infra/docker-compose.slots.yml overlays/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-${{ env.BUILD }}
          path: |
            kit.json
            compose.yml
            prod-compose/
            overlays/
            sbom/
          retention-days: 90

  # Только кнопкой владельца. Границы — в установщике на узле: здесь лишь подпись и доставка.
  release:
    name: Выпуск на рабочую среду
    runs-on: ubuntu-latest
    needs: [kit]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.install
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      BUILD: 2.1-b${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kit-${{ env.BUILD }}
          path: kit
      - name: Подпись и установщик
        env:
          EXPECT: ${{ inputs.expect }}
          SIGN_KEY: ${{ secrets.KIT_SIGNING_KEY }}
          SSH_KEY: ${{ secrets.FIFTH_CI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FIFTH_CI_KNOWN_HOSTS }}
          HOST: ${{ secrets.FIFTH_CI_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$SIGN_KEY" > "$RUNNER_TEMP/sign.pem"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh.key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/token"
          node scripts/install-request.mjs --dir kit --expect "$EXPECT" \
            --sign-key-file "$RUNNER_TEMP/sign.pem" --token-file "$RUNNER_TEMP/token" |
            ssh -i "$RUNNER_TEMP/ssh.key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "fifth-ci@$HOST"

  build:
    name: Сборка всех приложений
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Собираются ВСЕ приложения: прежде команда включала только ядро, витрину
      # и админку, поэтому поломка трёх кабинетов или пакета ui проходила
      # зелёный CI (CODE-03).
      - run: npm run build
      # AI-шлюз (Python) удалён в 2.1-W05 вместе с анализом ИИ — его тестов и
      # аудита зависимостей в CI больше нет.
