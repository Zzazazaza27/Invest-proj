name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимальные права токена по умолчанию (принцип least privilege).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия по умолчанию для остальных гейтов. Диапазон, который проект
  # объявляет в `engines`, проверяется матрицей в гейте 1.
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- гейт 1
  static:
    name: Линт, типы, формат (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # ОБА конца объявленного диапазона `engines`. Раньше CI шёл только на 22,
    # а разработка велась на 24 — то есть версия, на которой пишется код,
    # гейтом не проверялась вовсе, и расхождение всплыло бы в проде (CODE-19).
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Типы приложений выводятся из d.ts рабочих пакетов: без сборки
      # typecheck не находит @unicorn/contracts и падает. Локально это не
      # видно — там dist уже лежит с прошлых сборок.
      - name: Сборка рабочих пакетов
        run: npm run build:packages
      - name: Prettier
        run: npm run format:check
      - name: ESLint (включая границу «фронт не импортирует бэкенд»)
        run: npm run lint
      - name: TypeScript strict
        run: npm run typecheck
      # Позитивный контроль: во фронтенд кладётся запрещённый импорт и
      # проверяется, что линтер его ловит. Без этого правило может тихо
      # перестать действовать, а заменяемость фронтенда — остаться на словах.
      - name: Граница фронт↔бэк работает (ADR-002)
        run: npm run gate:boundary
      # Статическая часть сетевого гейта: привязки портов в compose, анонимный
      # доступ к инфраструктуре, отключение проверки TLS, CORS с '*'.
      #
      # БЕЗ `--strict` намеренно: живого ядра в этом задании нет, и строгий
      # режим падал бы всегда. Зато число невыполненных проверок теперь печатается
      # отдельной строкой «не выполнено: N» — раньше они записывались как LOW и
      # тонули среди находок, а гейт объявлял себя пройденным (SEC-20).
      # Строгий режим (`npm run gate:net:strict`) входит в локальную цепочку
      # `npm run gate`, где периметр поднят. Перенос его в CI требует задания
      # с запущенным ядром — записано в TODO.
      - name: Сетевой гейт (статическая часть)
        run: npm run gate:net
      # Переиспользование секретов: в CI нет .env, проверяются плейсхолдеры
      # .env.example и fallback-значения docker-compose — копия примера «как
      # есть» не должна давать один пароль на несколько служб (Ф26).
      - name: Гейт переиспользования секретов
        run: npm run gate:secret-reuse
      # Согласованность KEK-доменов: тип KekDomain, вызовы seal*, карта ротации
      # и колонки *_wrapped_dek миграций не расходятся (Ф27). Живая часть
      # (пустота зарезервированных колонок) требует БД и идёт в локальном gate.
      - name: Гейт KEK-доменов (статическая часть)
        run: npm run gate:kek
      # Согласованность списков логин-ролей БД: bootstrap-roles.ts, границы
      # ролей, CI env и .env.example не расходятся (Ф32, CODE-HIGH-01 —
      # роль app_archive появилась в коде, но CI не получил её пароль и URL).
      - name: Гейт согласованности ролей БД
        run: npm run gate:roles-env
      # Целостность SAST-конфига: guardian.yml обязан совпадать с HEAD и не
      # быть пустым (обнулялся четырежды; semgrep с пустым конфигом молча
      # прогоняет 0 правил). В CI checkout всегда из коммита, поэтому здесь
      # гейт держит инвариант «в коммите не пустой», а не ловит внешний процесс.
      - name: Гейт целостности SAST-конфига
        run: npm run gate:sast-config

  # ---------------------------------------------------------------- гейт 2
  secrets-scan:
    name: Секрет-скан (ожидание 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Прямой запуск контейнера вместо gitleaks-action: action ожидает
      # results.sarif и лицензию для организаций, из-за чего падает на
      # приватном репозитории даже при отсутствии находок.
      #
      # Образ закреплён ДАЙДЖЕСТОМ, а не тегом. Тег `latest` подменяем: он
      # указывает на то, что владелец образа выложил последним, и гейт секретов
      # начал бы выполнять чужой неизвестный код при следующем прогоне без
      # единой правки в этом репозитории (SEC-18). Дайджест — единственная
      # неизменяемая ссылка. Соответствует v8.28.0.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
              --source=/repo --config=/repo/.gitleaks.toml \
              --no-banner --redact --exit-code 1
      # Приватные SSH-ключи не покидают локальную папку `.ssh/` (Ф58). Локально
      # то же держит хук pre-push, но он лежит в .git/hooks, не версионируется и
      # не переживает свежий клон — здесь проверка повторяется там, где её нельзя
      # обойти забывчивостью. Работа выбрана из-за `fetch-depth: 0` выше: без
      # полной истории проверка объектов видела бы один коммит. Установка
      # зависимостей не нужна — скрипт использует только встроенные модули Node
      # и git.
      - name: Гейт «ключи не покидают .ssh/»
        run: npm run gate:ssh-keys

  # ---------------------------------------------------------------- гейт 3
  sast:
    name: SAST semgrep (ожидание 0 ERROR)
    runs-on: ubuntu-latest
    container:
      # Дайджест соответствует 1.99.0. Тег в реестре можно перевесить на другой
      # образ; дайджест — нельзя (SEC-18).
      image: semgrep/semgrep@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ОГОВОРКА о неизменяемости. Сам semgrep закреплён дайджестом, а вот
      # наборы `p/...` разрешаются в реестре при каждом прогоне: их содержимое
      # может измениться без правки этого файла. Это принято осознанно —
      # застывший набор правил безопасности устаревает и перестаёт находить
      # новые классы дефектов, то есть цена «неизменяемости» здесь выше выгоды.
      # Проектные правила, на которых держится гейт, лежат в репозитории
      # (`.semgrep/guardian.yml`) и меняются только коммитом (SEC-18).
      - name: Проектные правила + OWASP
        run: |
          semgrep scan \
            --config .semgrep/guardian.yml \
            --config p/typescript \
            --config p/nodejsscan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --sarif --output semgrep.sarif .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------------------------------------------------------- гейт 4
  deps:
    name: Аудит зависимостей (с транзитивом)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high и выше — блокирующе)
        run: npm audit --audit-level=high
      # AI-контур появляется в фазе Ф7. Пока файла нет — шаг пропускается явно
      # и с сообщением, а не «зеленеет» молча.
      - name: Python-зависимости AI-контура
        run: |
          if [ -f apps/ai-gateway/requirements.txt ]; then
            python -m pip install --quiet pip-audit==2.9.0
            pip-audit -r apps/ai-gateway/requirements.txt --strict
          else
            echo "::notice::apps/ai-gateway/requirements.txt отсутствует — AI-контур ещё не реализован (фаза Ф7). Проверка НЕ выполнялась."
          fi

  # ---------------------------------------------------------------- гейт 5
  database:
    name: Миграции + RLS-тесты на реальном PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        # Дайджест соответствует pg16.
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: unicorn_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d unicorn_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Прогон миграций up на чистой БД
        run: npm run migrate -w database
      - name: Линтер миграций (expand/contract, FK/RLS/GRANT)
        run: npm run lint:migrations -w database
      # Логин-роли заводятся ДО тестов: rls.test.ts проверяет членство
      # app_backend_user в группах, и на пустой базе тест видел роль
      # несуществующей — «expected [] to deeply equal [app_backend,
      # app_public_read]». Шаг стоял после тестов с Ф18, из-за чего джоб падал
      # на каждом прогоне.
      # Постоянные гейты прав. Локально они прогонялись руками — то есть не
      # прогонялись на каждом изменении: расширить права сервисной роли или
      # выдать PUBLIC право на SECURITY DEFINER можно было незаметно для CI.
      - name: Логин-роли БД из переменных окружения
        run: npm run bootstrap:roles -w database
        env:
          DB_ROLE_PASSWORD_APP_BACKEND: ci_only_role_password_backend_00
          DB_ROLE_PASSWORD_APP_PUBLIC_READ: ci_only_role_password_public_00
          DB_ROLE_PASSWORD_APP_INVESTMENTS: ci_only_role_password_invest_00
          DB_ROLE_PASSWORD_APP_BILLING: ci_only_role_password_billing_00
          DB_ROLE_PASSWORD_APP_NOTIFICATIONS: ci_only_role_password_notify_00
          DB_ROLE_PASSWORD_APP_INTEGRATION: ci_only_role_password_integr_00
          DB_ROLE_PASSWORD_APP_READONLY: ci_only_role_password_readonly_0
          DB_ROLE_PASSWORD_APP_MAINTENANCE: ci_only_role_password_mainten_0
          DB_ROLE_PASSWORD_APP_AUTH: ci_only_role_password_authstate_0
          DB_ROLE_PASSWORD_APP_ARCHIVE: ci_only_role_password_archive_00
      - name: Негативные тесты RLS и конкурентные инварианты
        run: npm run test -w database
      - name: Права PUBLIC на функциях SECURITY DEFINER (ожидание 0 нарушений)
        run: node scripts/check-definer-privileges.mjs
      # Строки подключения собираются в шаге, а не лежат литералами: пароль
      # внутри URL — то самое, что запрещено в проекте и что ловит собственный
      # секрет-скан (он и поймал первую версию этого шага).
      - name: Границы сервисных ролей БД
        run: |
          host="localhost:5432/unicorn_test"
          export DATABASE_URL="postgres://app_backend_user:${PW_BACKEND}@${host}"
          export DATABASE_URL_APP_INVESTMENTS="postgres://app_investments_user:${PW_INVEST}@${host}"
          export DATABASE_URL_APP_BILLING="postgres://app_billing_user:${PW_BILLING}@${host}"
          export DATABASE_URL_APP_NOTIFICATIONS="postgres://app_notifications_user:${PW_NOTIFY}@${host}"
          export DATABASE_URL_APP_INTEGRATION="postgres://app_integration_user:${PW_INTEGR}@${host}"
          export DATABASE_URL_APP_MAINTENANCE="postgres://app_maintenance_user:${PW_MAINTEN}@${host}"
          export DATABASE_URL_APP_AUTH="postgres://app_auth_user:${PW_AUTH}@${host}"
          export DATABASE_URL_APP_ARCHIVE="postgres://app_archive_user:${PW_ARCHIVE}@${host}"
          node scripts/check-service-roles.mjs
        env:
          PW_AUTH: ci_only_role_password_authstate_0
          PW_BACKEND: ci_only_role_password_backend_00
          PW_BILLING: ci_only_role_password_billing_00
          PW_NOTIFY: ci_only_role_password_notify_00
          PW_INTEGR: ci_only_role_password_integr_00
          PW_MAINTEN: ci_only_role_password_mainten_0
          PW_ARCHIVE: ci_only_role_password_archive_00
          PW_INVEST: ci_only_role_password_invest_00

  # ---------------------------------------------------------------- гейт 6
  unit:
    name: Юнит и интеграционные тесты core
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        # Дайджест соответствует pg16.
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: unicorn_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d unicorn_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
      redis:
        # Дайджест соответствует 7.4-alpine.
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Тесты ядра резолвят @unicorn/contracts через package.json main,
      # то есть требуют собранного пакета. Job запускает workspace напрямую,
      # минуя корневой скрипт test, поэтому сборка нужна здесь явно.
      - run: npm run build:packages
      - run: npm run migrate -w database
      # apps/core появляется в фазе Ф3.
      - name: Тесты core
        run: |
          if [ -f apps/core/package.json ]; then
            npm run test -w apps/core
          else
            echo "::notice::apps/core ещё не реализован (фаза Ф3). Тесты НЕ выполнялись."
          fi

  # ---------------------------------------------------------------- гейт 7
  build:
    name: Сборка всех приложений
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Собираются ВСЕ приложения: прежде команда включала только ядро, витрину
      # и админку, поэтому поломка трёх кабинетов или пакета ui проходила
      # зелёный CI (CODE-03).
      - run: npm run build

      - name: Тесты AI-шлюза (Python)
        run: |
          # Версии закреплены: незакреплённый инструмент в цепочке сборки — это
          # чужой код, который меняется без правки этого файла (SEC-18).
          # pip тоже закреплён (SEC-MED-07): «--upgrade pip» без версии менял
          # бутстрап-инструмент без правки коммита; набор пакетов — тот же
          # requirements-dev.txt, что и локально, а не отдельный список.
          python -m pip install pip==24.3.1
          pip install -r apps/ai-gateway/requirements-dev.txt
          cd apps/ai-gateway && python -m pytest tests/ -q
