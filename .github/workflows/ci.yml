name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимальные права токена по умолчанию (принцип least privilege).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- гейт 1
  static:
    name: Линт, типы, формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Типы приложений выводятся из d.ts рабочих пакетов: без сборки
      # typecheck не находит @unicorn/contracts и падает. Локально это не
      # видно — там dist уже лежит с прошлых сборок.
      - name: Сборка рабочих пакетов
        run: npm run build:packages
      - name: Prettier
        run: npm run format:check
      - name: ESLint (включая границу «фронт не импортирует бэкенд»)
        run: npm run lint
      - name: TypeScript strict
        run: npm run typecheck
      # Позитивный контроль: во фронтенд кладётся запрещённый импорт и
      # проверяется, что линтер его ловит. Без этого правило может тихо
      # перестать действовать, а заменяемость фронтенда — остаться на словах.
      - name: Граница фронт↔бэк работает (ADR-002)
        run: npm run gate:boundary

  # ---------------------------------------------------------------- гейт 2
  secrets-scan:
    name: Секрет-скан (ожидание 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Прямой запуск контейнера вместо gitleaks-action: action ожидает
      # results.sarif и лицензию для организаций, из-за чего падает на
      # приватном репозитории даже при отсутствии находок.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect \
              --source=/repo --config=/repo/.gitleaks.toml \
              --no-banner --redact --exit-code 1

  # ---------------------------------------------------------------- гейт 3
  sast:
    name: SAST semgrep (ожидание 0 ERROR)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Проектные правила + OWASP
        run: |
          semgrep scan \
            --config .semgrep/guardian.yml \
            --config p/typescript \
            --config p/nodejsscan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --sarif --output semgrep.sarif .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------------------------------------------------------- гейт 4
  deps:
    name: Аудит зависимостей (с транзитивом)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high и выше — блокирующе)
        run: npm audit --audit-level=high
      # AI-контур появляется в фазе Ф7. Пока файла нет — шаг пропускается явно
      # и с сообщением, а не «зеленеет» молча.
      - name: Python-зависимости AI-контура
        run: |
          if [ -f apps/ai-gateway/requirements.txt ]; then
            python -m pip install --quiet pip-audit
            pip-audit -r apps/ai-gateway/requirements.txt --strict
          else
            echo "::notice::apps/ai-gateway/requirements.txt отсутствует — AI-контур ещё не реализован (фаза Ф7). Проверка НЕ выполнялась."
          fi

  # ---------------------------------------------------------------- гейт 5
  database:
    name: Миграции + RLS-тесты на реальном PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: unicorn_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d unicorn_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Прогон миграций up на чистой БД
        run: npm run migrate -w database
      - name: Линтер миграций (expand/contract, FK/RLS/GRANT)
        run: npm run lint:migrations -w database
      - name: Негативные тесты RLS и конкурентные инварианты
        run: npm run test -w database

  # ---------------------------------------------------------------- гейт 6
  unit:
    name: Юнит и интеграционные тесты core
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: unicorn_test
          POSTGRES_USER: unicorn_owner
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U unicorn_owner -d unicorn_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      DATABASE_URL_OWNER: postgres://unicorn_owner:ci_only_password@localhost:5432/unicorn_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Тесты ядра резолвят @unicorn/contracts через package.json main,
      # то есть требуют собранного пакета. Job запускает workspace напрямую,
      # минуя корневой скрипт test, поэтому сборка нужна здесь явно.
      - run: npm run build:packages
      - run: npm run migrate -w database
      # apps/core появляется в фазе Ф3.
      - name: Тесты core
        run: |
          if [ -f apps/core/package.json ]; then
            npm run test -w apps/core
          else
            echo "::notice::apps/core ещё не реализован (фаза Ф3). Тесты НЕ выполнялись."
          fi

  # ---------------------------------------------------------------- гейт 7
  build:
    name: Сборка всех приложений
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Собираются ВСЕ приложения: прежде команда включала только ядро, витрину
      # и админку, поэтому поломка трёх кабинетов или пакета ui проходила
      # зелёный CI (CODE-03).
      - run: npm run build

      - name: Тесты AI-шлюза (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-gateway/requirements.txt
          pip install pytest
          cd apps/ai-gateway && python -m pytest tests/ -q
