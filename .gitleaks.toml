# Конфигурация секрет-скана. Гейт CI: 0 находок (RULES.md §3).
title = "UNICORN LAUNCH gitleaks"

[extend]
useDefault = true

[[rules]]
id = "unicorn-kek-material"
description = "Ключевой материал KEK/DEK в открытом виде"
regex = '''(?i)(KEK_[A-Z_]+|wrapped_dek|dek_plain)\s*[:=]\s*['"]?[A-Za-z0-9+/]{40,}={0,2}['"]?'''
tags = ["key", "crypto"]

[[rules]]
id = "unicorn-db-url-with-password"
description = "Строка подключения к БД с непустым паролем"
# gitleaks на Go/RE2: negative lookahead (?!...) не поддерживается.
# Плейсхолдеры отсеиваются секцией [allowlist] ниже, а не в самом regex.
regex = '''postgres(ql)?:\/\/[a-z_][a-z0-9_]*:[^\s:@\/]{8,}@'''
tags = ["database"]

[[rules]]
id = "unicorn-webhook-secret"
description = "Секрет вебхука в коде"
regex = '''(?i)(webhook_secret|hmac_secret|signing_secret)\s*[:=]\s*['"][^'"\s]{16,}['"]'''
tags = ["secret"]

[allowlist]
description = "Плейсхолдеры, тестовые фикстуры и эфемерные креды CI"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)gitleaks-report\.json$''',
]
regexes = [
  '''CHANGE_ME''',
  # Подстановка переменной на месте пароля — это ИМЯ переменной, а не секрет:
  # `postgres://user:${PW_BACKEND}@host`. Правило не умеет negative lookahead
  # (gitleaks на Go/RE2), поэтому такие строки отсеиваются здесь. Настоящий
  # пароль под этот шаблон не подходит.
  '''\$\{[A-Za-z_][A-Za-z0-9_]*\}''',
  '''local_dev_only_change_me''',
  '''test[-_]?fixture''',
  # ci_only_password — пароль service-контейнера PostgreSQL внутри GitHub
  # Actions. Контейнер живёт только на время job, доступен исключительно с
  # localhost раннера и уничтожается вместе с ним. Значение намеренно
  # самоописательное, чтобы его нельзя было спутать с рабочим секретом.
  # Исключение узкое: одна конкретная строка, а не отключение правила.
  '''ci_only_password''',
  # ci_only_role_password_* — пароли ЛОГИН-РОЛЕЙ того же эфемерного контейнера
  # PostgreSQL: их заводит шаг bootstrap:roles внутри job, и живут они ровно
  # столько же. Попали в историю в фазе Ф19 внутри строк подключения — это
  # было ошибкой формы (пароль внутри URL), и форма исправлена: строки теперь
  # собираются в шаге из отдельных переменных. Само значение секретом не
  # является и ротации не требует, поэтому история не переписывается.
  # Исключение узкое: конкретный самоописательный префикс, а не правило целиком.
  '''ci_only_role_password_[a-z0-9_]+''',
  # Ключ идемпотентности — идентификатор запроса, а не секрет: он передаётся в
  # заголовке открытым текстом и не даёт доступа сам по себе. Считать его
  # утечкой — категориальная ошибка.
  '''idem-[A-Za-z0-9._:-]+''',
]
