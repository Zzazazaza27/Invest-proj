# Локальный/CI контур Пятый элемент.
#
# ВНИМАНИЕ: это конфигурация для разработки и CI. Пароли здесь — заведомо
# нерабочие плейсхолдеры для локального окружения, они не используются нигде,
# кроме контейнеров на 127.0.0.1. Production-контур (Terraform/Helm) ещё НЕ
# написан — ссылаться на несуществующий каталог значило бы обещать его наличие
# с секретами из Vault/KMS (External Secrets), а не из этого файла.
#
# Все порты биндятся ТОЛЬКО на 127.0.0.1 — контейнеры не торчат в сеть.

name: fifth

services:
  # Единая точка входа: витрина, кабинеты и API на одном адресе без портов.
  #
  # Раздаёт СОБРАННУЮ статику из `apps/*/dist` — то есть ровно то, что уйдёт в
  # боевой контур. Если каталог не собран, nginx ответит 404 на этот раздел, а
  # не поднимет старую версию: пустой ответ честнее, чем вчерашняя сборка.
  #
  # Запускается отдельным профилем: инфраструктуре (БД, очереди, хранилище)
  # прокси не нужен, и поднимать его при каждом `infra:up` незачем.
  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: fifth-web
    restart: unless-stopped
    profiles: ['web']
    ports:
      - '127.0.0.1:${WEB_PORT:-80}:80'
    volumes:
      # Шаблон: образ nginx при старте подставляет ${CORE_HOST} и кладёт
      # результат в conf.d/default.conf. Переменные самого nginx ($host и т.п.)
      # не трогаются — подставляются только объявленные в окружении.
      - ../infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ../apps/web-public/dist:/srv/web-public:ro
      - ../apps/lab/dist:/srv/lab:ro
      - ../apps/investor/dist:/srv/investor:ro
      - ../apps/admin/dist:/srv/admin:ro
      - ../apps/auth/dist:/srv/login:ro
      # Файл маршрута по умолчанию (блок 09, задание 3) — как в образе web.
      - ../infra/images/web-route.sh:/docker-entrypoint.d/15-fifth-route.sh:ro
      # Служебная консоль монтируется наравне с остальными. Прежде её прятали
      # от боевого контура тремя рубежами (отдельная сборка, отдельный
      # compose-файл, отдельный каталог конфигов) — и все три снимало одно
      # значение NODE_ENV. Теперь доступ решает роль: анониму 404, админу —
      # консоль. Прятать то, что и так защищено, значит усложнять без выгоды.
      #
      # Сам том при этом отсутствовал: комментарий про «монтируется наравне»
      # стоял, а строки не было, и `/console/` отдавал 404 даже администратору —
      # то есть выглядел как работающий запрет, хотя был обычной дырой в
      # конфигурации. Найдено при сведении локального запуска (2026-09-20).
      - ../apps/console/dist:/srv/console:ro
      # Публичный пульс (только время и итог) — пишет scripts/monitor-pulse.mjs.
      - ${MONITOR_PULSE_PUBLIC_DIR:-../.local/pulse-public}:/srv/pulse:ro
    # Ядро запускается процессом на хосте, а не контейнером: маршрут /v1/
    # проксируется на host.docker.internal, и на Linux этого имени по умолчанию
    # нет — поэтому оно объявлено явно.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Хост ядра для /v1/ (см. infra/nginx/default.conf). На Linux его задаёт
    # scripts/infra.mjs — IPv4-шлюз Docker.
    environment:
      CORE_HOST: ${CORE_HOST:-host.docker.internal}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ВРЕМЕННАЯ ТОЧКА ВХОДА для прогонов, меняющих общие справочники.
  #
  # Те же собранные фронтенды, но маршрут /v1/ ведёт в ядро временного
  # контура, а не в рабочее. Профиль `testing` означает, что обычный
  # `stand:up` этот контейнер не поднимает: он живёт ровно столько, сколько
  # идёт прогон, и поднимается скриптом temp-stand.
  #
  # Рабочий стенд не затрагивается ничем: свой порт, свой конфиг, свой
  # контейнер. Конфигурацию работающего nginx править не пришлось.
  web-test:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: fifth-web-test
    profiles: ['testing']
    restart: 'no'
    ports:
      - '127.0.0.1:${TEMP_WEB_PORT:-8081}:80'
    volumes:
      - ../.local/temp-stand/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/web-public/dist:/srv/web-public:ro
      - ../apps/lab/dist:/srv/lab:ro
      - ../apps/investor/dist:/srv/investor:ro
      - ../apps/admin/dist:/srv/admin:ro
      - ../apps/auth/dist:/srv/auth:ro
      - ../apps/console/dist:/srv/console:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: fifth/postgres:16
    container_name: fifth-postgres
    restart: unless-stopped
    # tini процессом №1 (2.1-W07). Без него фоновый процесс асинхронного
    # архива pgBackRest после отсоединения доставался PostgreSQL как дочерний,
    # и его выход с ошибкой postmaster принимал за падение — перезапуск всех
    # соединений при любом сбое архива (поймано имитацией сбоя 30.10.2026).
    init: true
    environment:
      POSTGRES_DB: fifth_element
      POSTGRES_USER: unicorn_owner
      # Fallback-значения секретов различимы по службам (Ф26): даже запуск без
      # .env не должен давать один пароль на несколько служб — привычка к общей
      # схеме переезжает в боевой контур. Гейт: scripts/check-secret-reuse.mjs.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_pg_change_me}
      # Читается init-скриптом при первой инициализации кластера: он заводит
      # СВОЮ роль-владельца для БД Keycloak (Ф45).
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local_dev_only_kc_db_change_me}
      # scram-sha-256 вместо md5 — обязательный минимум
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      TZ: UTC
      PGTZ: UTC
      # Резервирование (блок 7, 2.1-W07). pgBackRest читает настройки из
      # переменных PGBACKREST_*; их наследует и archive_command — процессы
      # сервера получают окружение контейнера. Пароль шифрования хранилища
      # копий — секрет стенда (.env) и комплекта ключей Томаса.
      PGBACKREST_STANZA: main
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_USER: unicorn_owner
      PGBACKREST_PG1_DATABASE: fifth_element
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_pg_change_me}
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_PGBACKREST_CIPHER_PASS:-local_dev_only_backup_change_me}
      # Удаление копий выключено до согласованного правила (7.5): срок
      # хранения — предел pgBackRest, по сути «не удалять».
      PGBACKREST_REPO1_RETENTION_FULL: '9999999'
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_ARCHIVE_ASYNC: 'y'
      PGBACKREST_SPOOL_PATH: /var/spool/pgbackrest
      # Если архив не принимает журнал (нет места, сбой), сверх этого объёма
      # журнал перестаёт копиться в pg_wal: архив получит разрыв — его ловит
      # проверка, — но база не остановится из-за заполненного диска.
      PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: 2GiB
      PGBACKREST_LOG_LEVEL_CONSOLE: warn
      PGBACKREST_LOG_LEVEL_FILE: info
    command:
      - postgres
      - -c
      # Архив журнала включается на стенде, где настроено резервирование
      # (BACKUP_ARCHIVE_MODE=on): без хранилища archive_command отказывал бы,
      # и журнал копился бы в pg_wal.
      - archive_mode=${BACKUP_ARCHIVE_MODE:-off}
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - wal_level=replica
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - password_encryption=scram-sha-256
      # Журнал без данных (блок 8, 8.4; 2026-11-02). Ошибки клиентских
      # запросов (уровень ERROR) несут значения в самом сообщении и в
      # DETAIL/CONTEXT — «Key (…)=(…)», «Failing row contains», «invalid input
      # syntax: "…"»; текст запроса — в STATEMENT. Поэтому: ERROR и WARNING в
      # журнал сервера не пишутся (код ошибки видит ядро), подробности и
      # текст запроса отключены. Медленные запросы в журнал не пишутся;
      # наблюдение — числовая статистика pg_stat_statements по queryid без
      # текста SQL (нормализация не гарантирует удаления всех значений,
      # текст читается только служебной диагностикой).
      - -c
      - log_min_messages=log
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - max_connections=120
      - -c
      - timezone=UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Хранилище копий базы — каталог узла, а не том: его забирает команда
      # скачивания и (позже) внешний приёмник. По умолчанию — том.
      - ${BACKUP_PGBACKREST_DIR:-pgbackrest}:/var/lib/pgbackrest
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unicorn_owner -d fifth_element']
      interval: 5s
      timeout: 5s
      retries: 20

  # Общие счётчики ограничений (4.8, D-008). Valkey вместо Redis 7.4 с
  # 29.10.2026: открытая лицензия BSD, протокол тот же — переменные REDIS_*
  # прежние. Версия закреплена точно; ветка 8.1 сопровождается до 03.2028.
  # Данные — только временные счётчики: новый том, перенос не нужен.
  valkey:
    image: valkey/valkey:8.1.11@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    container_name: fifth-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:-local_dev_only_redis_change_me}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_dev_only_redis_change_me}

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: fifth-nats
    restart: unless-stopped
    command:
      - '-js'
      - '-sd'
      - '/data'
      - '-m'
      - '8222'
      - '--user'
      - 'unicorn'
      - '--pass'
      - '${NATS_PASSWORD:-local_dev_only_nats_change_me}'
    ports:
      - '127.0.0.1:${NATS_PORT:-4222}:4222'
      - '127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - natsdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8222/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Брокер ДЛЯ РАЗРУШИТЕЛЬНЫХ ПРОВЕРОК.
  #
  # Отдельный экземпляр появился после того, как проверка живучести
  # остановила общий брокер стенда ради испытания отдельного ядра
  # (2026-09-22). Своя база у такой проверки уже была, но брокер оставался
  # общим — а отдельная база не делает среду отдельной.
  #
  # Всё своё: порты, том, имя контейнера. Профиль `testing` означает, что
  # обычный `stand:up` его не поднимает — он нужен только прогонам
  # устойчивости и поднимается ими же.
  nats-test:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: fifth-nats-test
    profiles: ['testing']
    restart: 'no'
    command:
      - '-js'
      - '-sd'
      - '/data'
      - '-m'
      - '8222'
      - '--user'
      - 'unicorn'
      - '--pass'
      - '${NATS_PASSWORD:-local_dev_only_nats_change_me}'
    ports:
      - '127.0.0.1:${NATS_TEST_PORT:-4223}:4222'
      - '127.0.0.1:${NATS_TEST_MONITOR_PORT:-8223}:8222'
    volumes:
      - natstestdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8222/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Garage — файловое хранилище (D-001; переход с MinIO, план
  # docs/architecture/garage-migration-plan.md). Три узла, три копии; на одном
  # сервере это НЕ защита от потери сервера (см. infra/garage/garage.toml).
  # S3 и admin API публикуются на петле только у первого узла; узлы между
  # собой — по RPC в сети compose. Раскладку, бакеты и ключи заводит
  # scripts/garage-init.mjs. Образ закреплён дайджестом (v2.4.1).
  garage-1: &garage
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: fifth-garage-1
    restart: unless-stopped
    command: ['/garage', 'server']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage1meta:/var/lib/garage/meta
      - garage1data:/var/lib/garage/data
    ports:
      # S3 на петле: после переключения — порт прежнего MinIO (9000), чтобы
      # адрес у ядра и Caddy не менялся; до окна переноса на VPS —
      # GARAGE_S3_PORT=3900 рядом с работающим MinIO.
      - '127.0.0.1:${GARAGE_S3_PORT:-9000}:3900'
      - '127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903'
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 20

  garage-2:
    <<: *garage
    container_name: fifth-garage-2
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage2meta:/var/lib/garage/meta
      - garage2data:/var/lib/garage/data
    ports: []

  garage-3:
    <<: *garage
    container_name: fifth-garage-3
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage3meta:/var/lib/garage/meta
      - garage3data:/var/lib/garage/data
    ports: []

  # Роль и БД для IdP. Отдельный одноразовый контейнер, а не только init-скрипт
  # кластера: init-скрипты Postgres выполняются ТОЛЬКО при первой инициализации
  # тома, поэтому на уже существующем стенде роль не появилась бы вовсе —
  # проверено фактом (Keycloak падал с «password authentication failed for user
  # keycloak»). Идемпотентно: повторный запуск обновляет пароль той же роли.
  keycloak-db-init:
    image: fifth/postgres:16
    container_name: fifth-keycloak-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_pg_change_me}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local_dev_only_kc_db_change_me}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -h postgres -U unicorn_owner -d fifth_element <<SQL
        DO \$\$
        BEGIN
          IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'keycloak') THEN
            EXECUTE format('ALTER ROLE keycloak LOGIN PASSWORD %L', '$KEYCLOAK_DB_PASSWORD');
          ELSE
            EXECUTE format('CREATE ROLE keycloak LOGIN PASSWORD %L', '$KEYCLOAK_DB_PASSWORD');
          END IF;
        END
        \$\$;
        SQL
        psql -v ON_ERROR_STOP=1 -h postgres -U unicorn_owner -d fifth_element -tAc \
          "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || \
          psql -v ON_ERROR_STOP=1 -h postgres -U unicorn_owner -d fifth_element \
            -c "CREATE DATABASE keycloak OWNER keycloak"
        psql -v ON_ERROR_STOP=1 -h postgres -U unicorn_owner -d fifth_element \
          -c "ALTER DATABASE keycloak OWNER TO keycloak"
        echo "роль и БД keycloak готовы (владелец — keycloak, не unicorn_owner)"
    profiles: ['idp']
    restart: 'no'

  # Проверенный IdP. Launch НЕ реализует протокол OIDC самостоятельно
  # (docs/architecture/Database_Launch.md §2): сессии, refresh-токены, WebAuthn, MFA и ключи
  # подписи живут в БД Keycloak, а не в fifth_element.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fifth-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local_dev_only_kc_change_me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # СВОЯ роль, а не unicorn_owner: владелец схем платформы — это доступ
      # ко всем данным кластера, включая регулируемый контур. IdP нужна только
      # его собственная БД (MEDIUM внешнего аудита №2).
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local_dev_only_kc_db_change_me}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8081}:8080'
    volumes:
      # Каталог с экспортом realm. Монтируется целиком, а не одним файлом:
      # отсутствующий файл docker создаёт как КАТАЛОГ, и Keycloak падает на
      # импорте — профиль idp не поднимался вовсе (HIGH внешнего аудита №2).
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    profiles: ['idp']

  mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    container_name: fifth-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${SMTP_UI_PORT:-8025}:8025'
    profiles: ['idp', 'full']

  # --------------------------------------------------------------- наблюдение
  # Zabbix 7.0 LTS (блок 8, 8.2; 2.1-W08a). Профиль `monitoring`: обычный
  # stand:up его не поднимает. Агент — в двух вариантах: `monitoring-local`
  # (сеть compose, локальный стенд) и `monitoring-host` (сеть узла, VPS: ядро,
  # PostgreSQL и прочее слушают петлю узла). База Zabbix — отдельная база и
  # роль в том же PostgreSQL: попадает в копии W07. Наружу не публикуется
  # ничего: веб и приём от агента — только на петле узла.
  zabbix-db-init:
    image: fifth/postgres:16
    container_name: fifth-zabbix-db-init
    profiles: ['monitoring']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_pg_change_me}
      ZABBIX_DB_PASSWORD: ${ZABBIX_DB_PASSWORD:-local_dev_only_zabbix_db_change_me}
      ZABBIX_MONITOR_DB_PASSWORD: ${ZABBIX_MONITOR_DB_PASSWORD:-local_dev_only_zabbix_monitor_change_me}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        q() { psql -v ON_ERROR_STOP=1 -h postgres -U unicorn_owner -d fifth_element "$$@"; }
        # Роль Zabbix: своя база, предел соединений (процессы сервера урезаны).
        q -v pw="$$ZABBIX_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE zabbix LOGIN CONNECTION LIMIT 30 PASSWORD %L', :'pw')
         WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'zabbix') \gexec
        SELECT format('ALTER ROLE zabbix LOGIN CONNECTION LIMIT 30 PASSWORD %L', :'pw') \gexec
        SQL
        q -tAc "SELECT 1 FROM pg_database WHERE datname = 'zabbix'" | grep -q 1 || \
          q -c "CREATE DATABASE zabbix OWNER zabbix ENCODING 'UTF8' TEMPLATE template0"
        # Роль наблюдения за PostgreSQL для агента: pg_monitor, без доступа к данным.
        q -v pw="$$ZABBIX_MONITOR_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE zbx_monitor LOGIN CONNECTION LIMIT 5 PASSWORD %L', :'pw')
         WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'zbx_monitor') \gexec
        SELECT format('ALTER ROLE zbx_monitor LOGIN CONNECTION LIMIT 5 PASSWORD %L', :'pw') \gexec
        GRANT pg_monitor TO zbx_monitor;
        GRANT CONNECT ON DATABASE fifth_element TO zbx_monitor;
        SQL
        echo "база и роли Zabbix готовы"
    restart: 'no'

  # Сервер Zabbix в двух вариантах: в сети Docker (стенд, monitoring-local)
  # и в сети узла (VPS, monitoring-host). На VPS Telegram доступен только по
  # IPv6, а у сетей Docker IPv6 нет — оповещения из контейнера не уходили
  # (выпуск W08a 2026-11-02: «Connection timed out» к api.telegram.org).
  # В сети узла сервер ходит наружу тем же IPv6, что и узел. Порт 10051 при
  # этом слушается на узле — снаружи его закрывает ufw (входящие запрещены),
  # разрешены только сети Docker (веб-интерфейс).
  zabbix-server: &zabbix-server
    image: zabbix/zabbix-server-pgsql:alpine-7.0.31@sha256:bdfe90847bd259a6da448db1e6ae83f5f439224654ed767296a8d57a088975b9
    container_name: fifth-zabbix-server
    profiles: ['monitoring-local']
    restart: unless-stopped
    depends_on:
      zabbix-db-init:
        condition: service_completed_successfully
    environment: &zabbix-server-env
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: '5432'
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-local_dev_only_zabbix_db_change_me}
      POSTGRES_DB: zabbix
      # Процессы урезаны под один VPS и предел соединений роли (30).
      ZBX_STARTPOLLERS: '2'
      ZBX_STARTPOLLERSUNREACHABLE: '1'
      ZBX_STARTTRAPPERS: '3'
      ZBX_STARTPINGERS: '1'
      ZBX_STARTDISCOVERERS: '1'
      ZBX_STARTHTTPPOLLERS: '1'
      ZBX_STARTPREPROCESSORS: '2'
      ZBX_STARTDBSYNCERS: '2'
      ZBX_STARTALERTERS: '1'
      ZBX_STARTLLDPROCESSORS: '1'
      ZBX_CACHESIZE: 32M
      ZBX_HISTORYCACHESIZE: 16M
      ZBX_HISTORYINDEXCACHESIZE: 4M
      ZBX_TRENDCACHESIZE: 4M
      ZBX_VALUECACHESIZE: 16M
    ports:
      - '127.0.0.1:${ZABBIX_SERVER_PORT:-10051}:10051'
    mem_limit: 512m
    cpus: 1.0

  zabbix-server-host:
    <<: *zabbix-server
    profiles: ['monitoring-host']
    network_mode: host
    ports: []
    environment:
      <<: *zabbix-server-env
      DB_SERVER_HOST: 127.0.0.1
      DB_SERVER_PORT: '${POSTGRES_PORT:-5433}'

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.31@sha256:d9ce0774cb6036ce5d49c9c8d46bf1474dad98aae810350de0d5068dd679b92d
    container_name: fifth-zabbix-web
    profiles: ['monitoring']
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
        required: false
      zabbix-server-host:
        condition: service_started
        required: false
    # На VPS сервер в сети узла — веб ходит к нему через шлюз узла.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_WEB_SERVER_HOST:-zabbix-server}
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: '5432'
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-local_dev_only_zabbix_db_change_me}
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    # Только петля узла: на VPS — через ssh-туннель (блок 8, 8.2).
    ports:
      - '127.0.0.1:${ZABBIX_WEB_PORT:-8090}:8080'
    mem_limit: 256m
    cpus: 0.5

  zabbix-agent2: &zabbix-agent
    image: zabbix/zabbix-agent2:alpine-7.0.31@sha256:a9d9bb8e12fe7dea3917d9630507a9ded97b85913f3195b3b08a1354a49661a3
    container_name: fifth-zabbix-agent
    profiles: ['monitoring-local']
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: ${ZABBIX_HOST_NAME:-5e-stand}
      # Только активные проверки: агент сам отдаёт данные серверу, входящих
      # подключений к агенту нет.
      # Адрес сервера; образ сам ставит его в ServerActive (вторая переменная
      # дала бы повтор адреса, и агент не стартует).
      ZBX_SERVER_HOST: ${ZABBIX_AGENT_SERVER:-zabbix-server}
      ZBX_PASSIVE_ALLOW: 'false'
      ZBX_TIMEOUT: '10'
    # Без Docker socket: он даёт управление контейнерами (блок 8, 8.2).
    # Состояние контейнеров и резервирования агент читает из файлов узла.
    volumes:
      - /:/rootfs:ro
      - ${MONITOR_STATE_DIR:-./monitor-state}:/monitor:ro
      - ${BACKUP_DIR:-./backup-state}/state:/backup-state:ro
    mem_limit: 128m
    cpus: 0.25

  zabbix-agent2-host:
    <<: *zabbix-agent
    container_name: fifth-zabbix-agent-host
    profiles: ['monitoring-host']
    network_mode: host
    depends_on:
      - zabbix-server-host
    environment:
      ZBX_HOSTNAME: ${ZABBIX_HOST_NAME:-5e-vps}
      ZBX_SERVER_HOST: 127.0.0.1
      ZBX_PASSIVE_ALLOW: 'false'
      ZBX_TIMEOUT: '10'
    volumes:
      - /:/rootfs:ro
      - ${MONITOR_STATE_DIR:-/var/lib/fifth-monitor}:/monitor:ro
      - ${BACKUP_DIR:-/var/backups/fifth-element}/state:/backup-state:ro
      - /run/systemd/timesync:/host-timesync:ro

volumes:
  pgdata:
  valkeydata:
  natsdata:
  # Том брокера разрушительных проверок: отдельный, чтобы их стримы и
  # сообщения не смешивались с рабочими.
  natstestdata:
  garage1meta:
  garage1data:
  garage2meta:
  garage2data:
  garage3meta:
  garage3data:
  # Хранилище копий базы по умолчанию (BACKUP_PGBACKREST_DIR не задан).
  pgbackrest:
