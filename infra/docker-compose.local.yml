# Дополнение к `docker-compose.yml` для ЛОКАЛЬНОЙ разработки.
#
# Применяется вторым `-f` и только явно: `scripts/infra.mjs` подключает его,
# когда окружение не боевое. На сервере запускают базовый файл, и всё, что
# описано здесь, физически отсутствует в контейнере.
#
# Что здесь: публикация служебной консоли API на едином адресе. Её код лежит в
# репозитории и попадёт на сервер вместе с ним — это неизбежно. Не попасть туда
# должны три другие вещи, и каждая выключена отдельно:
#
#   1. СБОРКА       — `npm run build` не собирает консоль (есть отдельная
#                     команда `build:console`), поэтому `apps/console/dist` на
#                     сервере не появляется;
#   2. МАРШРУТ      — `location /console/` живёт в `infra/nginx/local/`,
#                     который монтируется только отсюда;
#   3. МОНТИРОВАНИЕ — этого файла нет в команде запуска на сервере.
#
# Любой одной из трёх достаточно, чтобы консоль не открылась. Проверяет это
# гейт `npm run gate:console-private`.

services:
  web:
    volumes:
      - ../infra/nginx/local:/etc/nginx/local:ro
      - ../apps/console/dist:/srv/console:ro
