# Установка одной среды 5Э из готовых образов. Файл один на все среды: имена,
# образы, адрес и размещение приходят при установке (`scripts/env.mjs`), правки
# под среду здесь не нужны. Хранилище — общий кластер Garage со своими бакетами и
# ключами среды (блок 12), поэтому своих узлов Garage в файле нет.
name: ${FIFTH_PROJECT:?}

x-secrets: &secrets ${FIFTH_ENV_DIR:?}/secrets:/run/secrets:ro

services:
  postgres:
    image: ${FIFTH_POSTGRES_IMAGE:?}
    container_name: ${FIFTH_PROJECT}-postgres
    mem_limit: ${FIFTH_MEM_POSTGRES:-0}
    cpus: ${FIFTH_CPU_POSTGRES:-0}
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: fifth_element
      POSTGRES_USER: fifth_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      KEYCLOAK_DB_PASSWORD: ${FIFTH_KEYCLOAK_DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - password_encryption=scram-sha-256
      # Журнал без данных (блок 8, 8.4): как в основном Compose. Текст ошибки сам
      # несёт значения («invalid input syntax», «Key (…)=(…)»), поэтому ERROR в журнал
      # сервера не пишется; сверка настроек — scripts/check-env-isolation.mjs.
      - -c
      - log_min_messages=log
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - max_connections=60
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - *secrets
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fifth_owner -d fifth_element']
      interval: 3s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.11@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    container_name: ${FIFTH_PROJECT}-valkey
    mem_limit: ${FIFTH_MEM_VALKEY:-0}
    cpus: ${FIFTH_CPU_VALKEY:-0}
    restart: unless-stopped
    # Пароль в файле настроек, а не в командной строке: её видно в `docker inspect`.
    command: ['valkey-server', '/run/secrets/valkey.conf']
    volumes:
      - valkeydata:/data
      - *secrets
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/REDIS_PASSWORD)" valkey-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: ${FIFTH_PROJECT}-nats
    mem_limit: ${FIFTH_MEM_NATS:-0}
    cpus: ${FIFTH_CPU_NATS:-0}
    restart: unless-stopped
    command: ['-c', '/run/secrets/nats.conf']
    volumes:
      - natsdata:/data
      - *secrets
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8222/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  # Одноразовый шаг установки: миграции и роли тем же образом ядра.
  migrate:
    image: ${FIFTH_CORE_IMAGE:?}
    container_name: ${FIFTH_PROJECT}-migrate
    profiles: ['tools']
    working_dir: /app/database
    env_file: ${FIFTH_ENV_DIR:?}/settings.env
    command:
      - sh
      - -c
      - >-
        node --experimental-strip-types src/migrate.ts &&
        node --experimental-strip-types src/bootstrap-roles.ts &&
        node --experimental-strip-types src/migrate.ts --status &&
        node ../scripts/nats-init-stream.mjs
    healthcheck:
      disable: true
    volumes:
      - *secrets
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  core:
    image: ${FIFTH_CORE_IMAGE:?}
    container_name: ${FIFTH_PROJECT}-core
    mem_limit: ${FIFTH_MEM_CORE:-0}
    cpus: ${FIFTH_CPU_CORE:-0}
    restart: unless-stopped
    init: true
    env_file: ${FIFTH_ENV_DIR:?}/settings.env
    # Ядро завершается за 30 с (BACKGROUND_STOP_GRACE_MS), запас — на выход процесса.
    stop_grace_period: 35s
    volumes:
      - *secrets
    networks: [default, storage]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy

  web:
    image: ${FIFTH_WEB_IMAGE:?}
    container_name: ${FIFTH_PROJECT}-web
    mem_limit: ${FIFTH_MEM_WEB:-0}
    cpus: ${FIFTH_CPU_WEB:-0}
    restart: unless-stopped
    environment:
      CORE_HOST: core
      FIFTH_ENV_LABEL: ${FIFTH_ENV_LABEL:-}
    ports:
      - '${FIFTH_WEB_BIND:-127.0.0.1}:${FIFTH_WEB_PORT:?}:80'
    depends_on:
      - core

volumes:
  pgdata:
  valkeydata:
  natsdata:

networks:
  storage:
    external: true
    name: ${FIFTH_STORAGE_NETWORK:?}
