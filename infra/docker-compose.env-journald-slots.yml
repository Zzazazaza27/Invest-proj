# Журнал второго слота ядра среды в journald (Тэнк 13.11) — дополнение к env-slots и
# env-journald. Подключает scripts/env.mjs, когда в compose.env среды стоят и FIFTH_SLOTS=1, и
# FIFTH_JOURNALD=1: core-b определён только в дополнении слотов, поэтому отдельным файлом.
#
# Тот же способ, что у первого слота (docker-compose.env-journald.yml): драйвер journald, тег
# `<проект>/<служба>`, метка среды fifth.env. Без него журнал core-b — json-file и пропадает при
# пересоздании (так пропал журнал испытания вебхука на test-1, 13.11).

services:
  core-b:
    labels:
      fifth.env: ${FIFTH_PROJECT:?}
    logging:
      driver: journald
      options:
        tag: '${FIFTH_PROJECT}/{{.Name}}'
        labels: fifth.env
