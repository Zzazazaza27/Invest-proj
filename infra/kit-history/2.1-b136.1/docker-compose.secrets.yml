# Каталог секретов рабочей среды — настройка площадки, а не комплекта (блок 5, задание 2).
#
# Подключает scripts/infra.mjs, когда в .env задан FIFTH_SECRETS_DIR. Файл берётся из
# репозитория, поэтому работает и с файлами запуска прежнего комплекта: возврат образов не
# возвращает значения в .env. Путь одинаков на узле и в контейнере.
services:
  core:
    volumes:
      - ${FIFTH_SECRETS_DIR:?}:${FIFTH_SECRETS_DIR:?}:ro
      # Файлы OpenBao Agent: токен Transit, в памяти узла (блок 5, задание 5).
      - /run/fifth-secrets:/run/fifth-secrets:ro
