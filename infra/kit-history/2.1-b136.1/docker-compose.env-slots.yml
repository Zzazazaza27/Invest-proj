# Слоты ядра тестовых и временных сред (блок 09, задание 3) — дополнение к файлу запуска.
#
# Подключает scripts/env.mjs, когда в compose.env среды задан FIFTH_SLOTS=1 (включается
# `env.mjs slots-enable`). Два слота: core (core-a) и core-b — одновременно работают только
# на время выпуска. Фон слота — только по разрешению установщика (release/grant), команды
# фона — с токеном (release/token). nginx ведёт запросы и статику по файлу маршрута
# (release/nginx/route.conf); статика сборок — release/static/<сборка>.
#
# Адреса в сети среды: core:4300 / core-b:4300, служебные — :4400 в каждом контейнере.
x-slot-env: &slot-env
  BACKGROUND_START: grant
  BACKGROUND_GRANT_PATH: /run/fifth-release/background-grant.json
  BACKGROUND_CONTROL_TOKEN_FILE: /run/fifth-release-token/token

services:
  core:
    image: ${FIFTH_CORE_A_IMAGE:?}
    environment:
      <<: *slot-env
      CORE_SLOT: core-a
      FIFTH_BUILD: ${FIFTH_CORE_A_BUILD:?}
    volumes:
      - ${FIFTH_ENV_DIR:?}/release/grant:/run/fifth-release:ro
      - ${FIFTH_ENV_DIR:?}/release/token:/run/fifth-release-token:ro

  core-b:
    image: ${FIFTH_CORE_B_IMAGE:-${FIFTH_CORE_A_IMAGE:?}}
    container_name: ${FIFTH_PROJECT}-core-b
    profiles: ['slot-b']
    mem_limit: ${FIFTH_MEM_CORE:-0}
    cpus: ${FIFTH_CPU_CORE:-0}
    restart: unless-stopped
    init: true
    env_file: ${FIFTH_ENV_DIR:?}/settings.env
    environment:
      <<: *slot-env
      CORE_SLOT: core-b
      FIFTH_BUILD: ${FIFTH_CORE_B_BUILD:-unknown}
    stop_grace_period: 35s
    volumes:
      - ${FIFTH_ENV_DIR:?}/secrets:/run/secrets:ro
      - ${FIFTH_ENV_DIR:?}/release/grant:/run/fifth-release:ro
      - ${FIFTH_ENV_DIR:?}/release/token:/run/fifth-release-token:ro
    networks: [default, storage]

  web:
    volumes:
      - ${FIFTH_ENV_DIR:?}/release/nginx:/etc/nginx/fifth-route:ro
      - ${FIFTH_ENV_DIR:?}/release/static:/srv/static:ro
