# Журналы контейнеров СРЕДЫ в journald (W32, Тэнк 10.11) — дополнение к файлу запуска среды.
#
# Зачем: по умолчанию журнал контейнера (json-file) стирается при пересоздании — так пропали
# requestId ошибок часового прогона test-1. В journald записи переживают пересоздание.
# Подключает scripts/env.mjs, когда в compose.env среды стоит FIFTH_JOURNALD=1; ставит флаг
# шаг infra/host/prod-env-journald.sh (сейчас — только test-1).
#
# Метка среды: поле CONTAINER_NAME (fifth-<среда>-<служба>), тег SYSLOG_IDENTIFIER
# `<проект>/<служба>` и поле FIFTH_ENV из метки контейнера.
# Объём: общий предел journald на VPS — infra/journald/50-fifth.conf (SystemMaxUse=4G,
# SystemKeepFree=15G); отдельного предела на контейнер journald не даёт.

x-journald: &journald
  labels:
    fifth.env: ${FIFTH_PROJECT:?}
  logging:
    driver: journald
    options:
      tag: '${FIFTH_PROJECT}/{{.Name}}'
      labels: fifth.env

services:
  core: *journald
  web: *journald
  postgres: *journald
  valkey: *journald
  nats: *journald
