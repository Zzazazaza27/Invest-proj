# Боевой режим среды из scripts/env.mjs (пилотная test-2). Дополняет файл запуска комплекта и
# подключается, пока в compose.env задан FIFTH_AGENT_DIR; ставит его
# infra/host/prod-test2-production.sh. Порядок тот же, что у рабочей среды (блок 5, задание 5):
# секреты и токен Transit — файлами Agent в памяти узла, TLS с проверкой к PostgreSQL, Valkey и
# NATS, хранилище — через шифрованный вход. Каталог секретов среды ядру не подключается: KEK в нём
# остаются только для копии и возврата.
#
# Каталоги в compose.env:
#   FIFTH_TLS_DIR       сертификаты служб и серверный ключ, ключа центра там нет
#   FIFTH_AGENT_DIR     файлы Agent в /run (память узла), заводит tmpfiles
#   FIFTH_OPENBAO_AGENT настройка Agent и вход AppRole среды
services:
  # OpenBao общий с рабочей средой, но вход, политика и ключи Transit у среды свои (префикс среды).
  agent:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    container_name: ${FIFTH_PROJECT}-agent
    user: '1990:1000'
    restart: unless-stopped
    command: ['agent', '-config=/agent/agent.hcl']
    volumes:
      - ${FIFTH_OPENBAO_AGENT:?}/agent.hcl:/agent/agent.hcl:ro
      - ${FIFTH_OPENBAO_AGENT:?}/role-id:/agent/role-id:ro
      - ${FIFTH_OPENBAO_AGENT:?}/secret-id:/agent/secret-id:ro
      - /etc/fifth-openbao/tls/tls.crt:/openbao/tls/tls.crt:ro
      - ${FIFTH_AGENT_DIR:?}:/run/fifth-secrets
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -s /run/fifth-secrets/openbao-token && test -s /run/fifth-secrets/POSTGRES_PASSWORD',
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  # Ядро требует в production https до хранилища вне своей петли. Garage говорит по http, поэтому
  # перед ним вход с TLS на сертификате среды; путь не выходит за узел.
  s3tls:
    image: ${FIFTH_CORE_IMAGE:?}
    container_name: ${FIFTH_PROJECT}-s3tls
    restart: unless-stopped
    mem_limit: 64m
    entrypoint:
      - node
      - -e
      - >-
        const fs=require('fs'),net=require('net'),tls=require('tls');
        tls.createServer({key:fs.readFileSync('/tls/server.key'),cert:fs.readFileSync('/tls/server.crt')},(c)=>{
        const s=net.connect(3900,'garage-1');c.pipe(s).pipe(c);
        c.on('error',()=>s.destroy());s.on('error',()=>c.destroy());}).listen(9443);
    volumes:
      - ${FIFTH_TLS_DIR:?}:/tls:ro
    networks: [storage]

  valkey:
    command: !override
      - valkey-server
      - /run/secrets/valkey.conf
      - --port
      - '0'
      - --tls-port
      - '6379'
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - 'no'
    volumes:
      - ${FIFTH_TLS_DIR:?}:/tls:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/REDIS_PASSWORD)" valkey-cli --tls --cacert /tls/ca.crt -h 127.0.0.1 ping | grep -q PONG',
        ]

  nats:
    command: !override
      - -c
      - /run/secrets/nats.conf
      - --tls
      - --tlscert
      - /tls/server.crt
      - --tlskey
      - /tls/server.key
    volumes:
      - ${FIFTH_TLS_DIR:?}:/tls:ro

  migrate:
    volumes: !override
      - ${FIFTH_AGENT_DIR:?}:/run/fifth-secrets:ro
    depends_on:
      agent:
        condition: service_healthy

  core:
    volumes: !override
      - ${FIFTH_AGENT_DIR:?}:/run/fifth-secrets:ro
    depends_on:
      agent:
        condition: service_healthy
      s3tls:
        condition: service_started
