# journald стенда 5Э (2.1-W08b, раздел 4 плана): потолок и запас диска.
# Устанавливается в /etc/systemd/journald.conf.d/50-fifth.conf,
# затем `systemctl restart systemd-journald` (штатный перезапуск нумерацию
# записей не меняет — проверено испытанием).
[Journal]
Storage=persistent
SystemMaxUse=4G
SystemKeepFree=15G
