# Единая точка входа: один адрес вместо шести портов.
#
# Пользователь не должен видеть номера портов — они свойство режима разработки,
# а не продукта. Здесь всё сводится к одному origin, и это не косметика:
#
#   * список разрешённых origin в CORS перестаёт быть нужен — запросы идут на
#     тот же сайт, откуда пришла страница;
#   * становится возможна cookie с префиксом `__Host-` (он требует единого
#     origin и Secure);
#   * CSRF-схема упрощается: всё в пределах одного сайта.
#
# Статика раздаётся из собранных каталогов `dist`, а не проксированием на
# dev-серверы Vite: так локальная раздача устроена ровно как боевая, и разница
# между «работает у меня» и «работает на стенде» не прячется в прокси.
#
# Консоль API (`apps/console`) здесь СОЗНАТЕЛЬНО отсутствует: она служебная и
# остаётся доступной только на своём порту разработчику. Маршрут к ней в этом
# файле означал бы, что однажды её выложат наружу вместе со всем остальным.

server {
    listen 80;
    server_name _;

    # Раздаваемое приложение — SPA: любой неизвестный путь внутри него должен
    # отдавать index.html, иначе перезагрузка страницы на внутреннем маршруте
    # даёт 404 (классический симптом «работает, пока не нажмёшь F5»).

    # --- API ядра -----------------------------------------------------------
    # Ядро живёт на хосте, а не в этой сети контейнеров: в разработке его
    # запускают как процесс (`scripts/dev-core.mjs`). Адрес хоста из контейнера —
    # host.docker.internal (в compose он объявлен через extra_hosts).
    # Адрес ядра берётся через встроенный DNS Docker (127.0.0.11) без IPv6:
    # Docker Desktop 29 пишет в /etc/hosts и IPv6-адрес шлюза хоста, до
    # которого из сети контейнеров нет маршрута, и nginx, чередуя адреса,
    # отвечал 502 на каждый второй запрос. Переменная в proxy_pass заставляет
    # nginx спрашивать резолвер, а не читать /etc/hosts при старте.
    #
    # На Linux встроенный DNS Docker имени host.docker.internal НЕ знает (оно
    # есть только в /etc/hosts через extra_hosts), и сервер отвечал 502 на
    # весь /v1/. Поэтому хост ядра подставляется из окружения при старте
    # контейнера (файл монтируется как шаблон nginx): на Linux scripts/infra.mjs
    # передаёт IPv4-адрес шлюза Docker, литерал резолвер не спрашивает; на
    # Docker Desktop остаётся имя по умолчанию.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $core_api "${CORE_HOST}:4300";

    location /v1/ {
        proxy_pass http://$core_api;
        proxy_http_version 1.1;

        # Ядро доверяет X-Forwarded-* только от адресов из TRUSTED_PROXY_CIDRS.
        # Без этих заголовков оно увидит адрес контейнера вместо адреса
        # клиента, и потолок частоты по адресу будет считаться на всех сразу.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ответы API не кешируются промежуточными узлами: в них персональные
        # данные. Заголовки ставит само ядро — здесь важно их не затереть.
        proxy_buffering off;
    }

    # --- Кабинеты -----------------------------------------------------------
    # Каждый кабинет собран с `base` равным своему подпути, поэтому ссылки на
    # ассеты внутри index.html уже указывают на /lab/assets/... и т.д.

    location /lab/ {
        alias /srv/lab/;
        try_files $uri $uri/ /lab/index.html;
    }

    location /investor/ {
        alias /srv/investor/;
        try_files $uri $uri/ /investor/index.html;
    }

    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /login/ {
        alias /srv/auth/;
        try_files $uri $uri/ /login/index.html;
    }

    # Адрес без завершающей косой черты — обычный способ, которым человек
    # набирает путь руками. Без этих правил `/lab` отдавал бы 404, и выглядело
    # бы это как «кабинета нет».
    location = /lab { return 301 /lab/; }
    location = /investor { return 301 /investor/; }
    location = /admin { return 301 /admin/; }
    location = /login { return 301 /login/; }

    # --- Локальные дополнения -----------------------------------------------
    # Каталог подключается ТОЛЬКО локальным compose-файлом
    # (`infra/docker-compose.local.yml`). В боевом контуре он не монтируется, и
    # шаблон не находит ни одного файла — это не ошибка nginx, а обычный пустой
    # include.
    #
    # Через него добавляется маршрут служебной консоли. Так «не выкладывать
    # консоль наружу» держится на отсутствии смонтированного каталога, а не на
    # том, что кто-то вспомнит убрать строку перед выкладкой.
        # --- Служебная консоль API ---------------------------------------------
    #
    # Доступна только администратору, вошедшему в платформу: решение принимает
    # ядро тем же guard'ом, что и на остальных маршрутах. Постороннему — 404.
    #
    # Раньше её прятали от боевого контура тремя рубежами, и 2026-09-13
    # выяснилось, что все три снимает одно значение NODE_ENV: на стенде стояло
    # `development`, и консоль открылась в интернет. Заодно тем же значением
    # было открыто описание API — защита, зависящая от окружения, оказалась
    # договорённостью, а не защитой.
    location /console/ {
        # Решение принимается ДО отдачи HTML: подзапрос к ядру с cookie
        # посетителя. 204 — пускаем, 401/403 — обработчик ниже.
        auth_request /__authz-console;

        alias /srv/console/;
        try_files $uri $uri/ /console/index.html;
    }

    # Ответ отказа — 404, а не 403. 403 подтверждал бы, что консоль здесь есть:
    # та же анти-оракульная линия, что у описания API в production и у локального
    # входа при AUTH_MODE=oidc.
    error_page 401 403 = @console-denied;

    location @console-denied {
        return 404;
    }

    # Внутренний подзапрос: наружу не маршрутизируется (`internal`).
    #
    # Тело запроса не пересылается — ядру нужен только факт сессии и роль. Cookie
    # передаётся явно: без неё подзапрос ушёл бы анонимным, и консоль не открылась
    # бы никому.
    location = /__authz-console {
        internal;
        proxy_pass http://$core_api/v1/auth/authz/console;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /console { return 301 /console/; }

    # --- Витрина ------------------------------------------------------------
    # Корень отдаёт публичную витрину. Она объявлена последней намеренно: более
    # частные location выше имеют приоритет, а сюда попадает всё остальное.
    location / {
        root /srv/web-public;
        try_files $uri $uri/ /index.html;
    }
}
