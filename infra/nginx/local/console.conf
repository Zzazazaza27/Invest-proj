# Служебная консоль API — только администратору, вошедшему в платформу.
#
# Этот файл подключается через `include /etc/nginx/local/*.conf` и попадает в
# контейнер лишь тогда, когда каталог смонтирован локальным compose-файлом
# `infra/docker-compose.local.yml`.
#
# Почему консоль вообще требует защиты: она не защищает себя сама — это обычный
# фронтенд, права проверяет сервер. Опасна не она сама, а то, что она даёт
# постороннему КАРТУ ВСЕГО API одним списком, включая выдачу служебных токенов,
# вебхуки и ротацию секретов. Отклонённые запросы останутся отклонёнными, но
# искать ничего не придётся.
#
# 2026-09-13 выяснилось, что этого «только локально» недостаточно. На боевом
# стенде в `.env` стоял `NODE_ENV=development`, `infra.mjs` подключил локальный
# профиль — и https://vgorkakh.ru/console/ отдавала настоящую консоль всем.
# Три независимые защиты, которыми гордится README, сняло одно значение
# переменной окружения.
#
# Поэтому теперь спрашиваем не окружение, а СЕССИЮ: пускать ли, решает ядро тем
# же guard'ом, что и на остальных маршрутах.

location /console/ {
    # Решение принимается ДО отдачи HTML: подзапрос к ядру с cookie
    # посетителя. 204 — пускаем, 401/403 — обработчик ниже.
    auth_request /__authz-console;

    alias /srv/console/;
    try_files $uri $uri/ /console/index.html;
}

# Ответ отказа — 404, а не 403. 403 подтверждал бы, что консоль здесь есть:
# та же анти-оракульная линия, что у описания API в production и у локального
# входа при AUTH_MODE=oidc.
error_page 401 403 = @console-denied;

location @console-denied {
    return 404;
}

# Внутренний подзапрос: наружу не маршрутизируется (`internal`).
#
# Тело запроса не пересылается — ядру нужен только факт сессии и роль. Cookie
# передаётся явно: без неё подзапрос ушёл бы анонимным, и консоль не открылась
# бы никому.
location = /__authz-console {
    internal;
    proxy_pass http://host.docker.internal:4300/v1/auth/authz/console;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /console { return 301 /console/; }
