# Служебная консоль API на едином адресе — ТОЛЬКО в локальной разработке.
#
# Этот файл подключается через `include /etc/nginx/local/*.conf` и попадает в
# контейнер лишь тогда, когда каталог смонтирован локальным compose-файлом
# `infra/docker-compose.local.yml`. В боевом контуре его запускать нечем:
# шаблон include не находит файлов, маршрута `/console/` не существует, и
# `/console/` отдаёт витрину, как любой неизвестный путь.
#
# Почему консоль не публикуется наравне с кабинетами: она не защищает себя
# сама — это обычный фронтенд, и права проверяет сервер. Опасна не она сама, а
# то, что она даёт постороннему КАРТУ ВСЕГО API одним списком, включая выдачу
# служебных токенов, вебхуки и ротацию секретов. Отклонённые запросы при этом
# останутся отклонёнными, но искать ничего не придётся.

location /console/ {
    alias /srv/console/;
    try_files $uri $uri/ /console/index.html;
}

location = /console { return 301 /console/; }
