<!doctype html>
<!--
  data-brand="nova" включает брендовую тему кабинета основателя. Атрибут стоит
  в разметке, а не выставляется скриптом: иначе первая отрисовка успевала бы
  пройти в базовой теме и страница моргала бы палитрой.
-->
<!--
  data-brand — скин по умолчанию (DEFAULT_SKIN), data-skin-pending — страница
  скрыта, пока main.tsx не прочитает скин платформы (applyPlatformSkin, M145).
  Так нет мелькания: страница впервые показывается уже в выбранном скине.
-->
<html lang="ru" data-brand="nova" data-skin-pending>
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Кабинет основателя — Пятый элемент</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
