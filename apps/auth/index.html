<!doctype html>
<!--
  data-brand="nova" включает брендовую тему платформы. Атрибут стоит в
  разметке, а не выставляется скриптом: иначе первая отрисовка успевала бы
  пройти в базовой теме и страница моргала бы палитрой.
-->
<html lang="ru" data-brand="nova">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — UNICORN LAUNCH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
