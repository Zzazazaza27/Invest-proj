# ФУНКЦИОНАЛЬНЫЕ БЛОКИ
#
# Зачем. «После большого изменения — регрессия затронутого» должно быть
# командой, а не пожеланием. Блок — это то, что проверяют вместе, когда
# трогали одну часть продукта: npm run suite:block доступ
#
# Состав блока — СУЖДЕНИЕ о том, что может сломаться вместе, собранное по
# назначению прогонов. Это не доказательство: тело большинства проверок не
# читалось (поле studied у каждой записи говорит правду об этом). Прогон,
# попавший не в свой блок, — ошибка группировки, а не продукта.
#
# Один прогон может входить в несколько блоков: граница доступа к файлам
# нужна и когда трогали файлы, и когда трогали права.
blocks:
  доступ:
    title: Права, роли, видимость и границы доступа
    members:
      [
        DBT-RLS,
        DBT-ACCESS-PATHS,
        DBT-PROJECT-ACCESS,
        DBT-PROJECT-ACCESS-DIRECTORY,
