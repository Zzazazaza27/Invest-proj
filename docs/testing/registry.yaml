    sensitivity:
      status: verified
      method: >-
        манифест краснел при добавлении identity.user_avatars (M125) и схемы
        testing (M129) — оба раза до внесения в список
      date: 2026-09-21
      commit: c219a96
    runPolicy: ci

  - id: ACC-RLS-002
    title: Основатель и инвестор не видят чужих проектов; удалённые роли прав не дают
    area: доступ
