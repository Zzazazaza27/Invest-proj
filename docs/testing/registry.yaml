# ---------------------------------------------------------------------------
# НАБОРЫ: воспроизводимые команды вместо «прогони, что вспомнишь».
#
# `handoff`    — перед передачей изменений владельцу. Основные цепочки и
#                критические границы доступа. Сверх него матрица изменений
#                добавляет прогоны затронутых областей.
# `regression` — перед выкатом и по требованию. Всё безопасное, что есть.
# `isolated`   — разрушительные проверки: своё ядро, своя база, свой брокер.
#                Запускаются отдельно и никогда не трогают рабочий стенд.
#
# Ночной автоматизации нет: наборы запускает человек. Это записано честно,
# а не подразумевается.
# ---------------------------------------------------------------------------

suites:
  handoff:
    title: Перед передачей владельцу
    runBy: Маус вручную
    command: npm run suite:handoff
    members:
      - DBT-ALL
      - CHK-ADMIN-USERS-API
      - CHK-TESTING-SESSIONS
      - CHK-PROFILE-API
      - CHK-CONTENT-TRANSFER
      - CHK-OUTBOUND-BOUNDARIES
      - CHK-FILE-ACCESS
      - SCN-ROUND-REVIEW
    note: >-
      Ядро набора фиксировано. Прогоны затронутого кабинета добавляются
      сверх него по матрице изменений (docs/testing/матрица-изменений.md);
      правки общей авторизации, работы с БД и общих компонентов требуют
      проверки ВСЕХ потребителей, а не одного экрана.

  regression:
    title: Регрессия перед выкатом или по требованию
    runBy: Маус вручную
    command: npm run suite:regression
    members:
      - DBT-ALL
      - CHK-ADMIN-USERS-API
      - CHK-TESTING-SESSIONS
      - CHK-PROFILE-API
      - CHK-CONTENT-TRANSFER
      - CHK-OUTBOUND-BOUNDARIES
      - CHK-DB-RECONNECT
      - CHK-FILE-ACCESS
      - SCN-ROUND-REVIEW
      - RND-ADMIN-USERS
      - RND-TESTING-SESSIONS
      - RND-PROFILE
      - RND-STAFF-ACCESS
    note: >-
      Браузерные прогоны требуют поднятого стенда (`npm run stand:up`) и
      переменной `UNICORN_ENTRY=web`.

  isolated:
    title: Разрушительные проверки в изоляции
    runBy: Маус вручную, отдельно от остальных наборов
    command: npm run suite:isolated
    members:
      - CHK-DB-RESILIENCE
    note: >-
      Поднимает СВОЁ ядро на тестовой базе и своём брокере. Рвёт соединения
      и ограничивает подключения только своей базы; общий брокер стенда не
      трогает. Восстанавливает зависимости даже при собственном падении.

# ---------------------------------------------------------------------------
# ПРОГОНЫ С НАМЕРЕННО РУЧНЫМ ЗАПУСКОМ.
#
# Не всякий скрипт обязан идти в набор. Здесь перечислено то, что вызывается
# человеком по поводу, с указанием причины — чтобы отсутствие в наборах не
# читалось как забывчивость.
# ---------------------------------------------------------------------------

manualByDesign:
  - id: TOOL-DR-RESTORE-CHECK
    reason: >-
      Снимает полную копию базы и разворачивает её в отдельную базу. Долго и
      тяжело; запускается перед выкатом и при изменениях схемы хранения.
  - id: TOOL-LOAD-TEST
    reason: >-
      Нагрузочный прогон. Создаёт много записей и искажает замеры соседних
      проверок; по решению владельца в общие наборы не входит.
  - id: TOOL-SEED-DEMO
    reason: Загрузка демонстрационного комплекта — подготовка данных, не проверка.
  - id: TOOL-SEED-ACCEPTANCE
    reason: Обстановка приёмки — подготовка данных, не проверка.
  - id: TOOL-CLEAN-PROBE-DATA
    reason: Уборка следов прогонов — обслуживание, вызывается по поводу.
  - id: TOOL-DB-BACKUP
    reason: Копия базы перед опасной работой — операция, а не проверка.
  - id: TOOL-INFRA
    reason: >-
      Управление контурами стенда, включая сброс данных. Запускается только
      по прямому решению владельца и никогда автоматически.
  - id: TOOL-RESET-TEST-DB
    reason: >-
      Полностью очищает базу. Разрушительна по назначению; вызывается в
      порядке чистого развёртывания.
