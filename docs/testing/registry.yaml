  - id: GAP-SEARCH-001
    title: Поиск и выгрузки не показывают записи, недоступные по правам
    area: доступ
    severity: high
    rationale: >-
      Протечка через поиск обходит RLS на уровне выдачи: строка не читается
      напрямую, но попадает в список результатов или в счётчик.
    checks: [SMK-LAB, DBT-INVARIANTS, UNIT-CORE-LAB]
    coverage: partial
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: gap
    limits: >-
      УТОЧНЕНО ЧТЕНИЕМ 2026-09-22, второй раз. Сначала стояло «не покрыто
      ничем», потом «покрыт только smoke-lab». На деле есть ещё две
      проверки: DBT-INVARIANTS проверяет, что описание проекта не попадает в
      публичный поисковый вектор и что публичной роли выданы права РОВНО на
      allowlist колонок каталога; UNIT-CORE-LAB — что лимит выдачи ограничен
      сверху («выдача не превращается в выгрузку базы»), сортировка и тип
      содержимого берутся из allowlist, а мусор в курсоре отвергается
      целиком. Остаётся непокрытым: поиск и выгрузки ВНУТРИ кабинетов
      эксперта и инвестора, и счётчик найденного как канал утечки при пустой
      выдаче.
      ИСПРАВЛЕНИЕ ОЦЕНКИ 2026-09-22. Стояло «не покрыто ничем» — неверно:
      smoke-lab проверяет, что публичный поиск по каталогу НЕ находит проект
      по непубличному описанию, что в тизере нет описания и внутреннего
      статуса. Не покрыто другое: не появляется ли в каталоге и поиске
      проект в режиме «выбранные инвесторы»; поиск и выгрузки внутри
      кабинетов эксперта и инвестора; счётчики и пагинация как канал утечки
      (число найденного при пустой выдаче).
