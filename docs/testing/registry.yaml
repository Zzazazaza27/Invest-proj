# Реестр проверяемого поведения платформы «Пятый элемент»
#
# ЕДИНЫЙ ИСТОЧНИК. Этот файл — единственная правда о том, какие свойства
# платформы защищены и чем. Читаемое представление
# (`docs/testing/реестр.md`) ГЕНЕРИРУЕТСЯ из него: править его руками
# бессмысленно, следующая генерация перезапишет.
#
# ПОЧЕМУ ФАЙЛ, А НЕ ДОКУМЕНТ. Документ о тестах расходится с кодом за
# недели, и это хуже его отсутствия: на него ссылаются. Здесь расхождение
# ловит проверка `npm run check:registry` — она падает, если указан
# несуществующий файл или команда, если появился прогон, которого нет в
# реестре, или если набор ссылается на несуществующий идентификатор.
# Проверка включена в CI.
#
# ЕДИНИЦА УЧЁТА — СВОЙСТВО, А НЕ КОМАНДА. Один прогон может защищать
# несколько требований; одно требование может проверяться несколькими
# прогонами или не проверяться вовсе — и тогда это записано явно.
#
# ЧЕСТНОСТЬ ВАЖНЕЕ ЗЕЛЁНОГО ЦВЕТА:
#   confirmation: confirmed-by-run  — запущено и подтверждено (с датой);
#                 reviewed-in-code  — прочитано, но не запускалось;
#                 needs-study       — требует отдельного разбора;
#                 blocked           — запустить нельзя, причина указана.
#   sensitivity   — проверено ли, что проверка КРАСНЕЕТ без починки.
#                 Отсутствие подтверждения не делает проверку бесполезной,
#                 но и не даёт считать её регрессионной защитой.

version: 1
date: 2026-09-22
commit: ec550db
environment: локальный стенд, Windows, Node 22, PostgreSQL 16

# Что защищено автоматически СЕГОДНЯ — без участия человека.
automation:
  ci:
    jobs: [push, static, secrets-scan, sast, deps, database, unit, build]
    covers:
      - линтер, формат, типы, сборка всех приложений
      - миграции и их линтер, тесты схемы БД (18 файлов, 291 проверка)
      - 'девять статических проверок и гейтов (см. runner: ci ниже)'
    note: >-
      Браузерные прогоны, smoke и probe в CI не запускаются: им нужен
      поднятый стенд с базой, брокером и хранилищем, которого в CI нет.
  manual:
    note: >-
      Всё остальное запускает человек. Наборы `suite:handoff` и
      `suite:regression` собирают это в воспроизводимые команды, но
      запускать их пока обязан Маус — ночной автоматизации нет.

