# ФУНКЦИОНАЛЬНЫЕ БЛОКИ
#
# Зачем. «После большого изменения — регрессия затронутого» должно быть
# командой, а не пожеланием. Блок — это то, что проверяют вместе, когда
# трогали одну часть продукта: npm run suite:block доступ
#
# Состав блока — СУЖДЕНИЕ о том, что может сломаться вместе, собранное по
# назначению прогонов. Это не доказательство: тело большинства проверок не
# читалось (поле studied у каждой записи говорит правду об этом). Прогон,
# попавший не в свой блок, — ошибка группировки, а не продукта.
#
# Один прогон может входить в несколько блоков: граница доступа к файлам
# нужна и когда трогали файлы, и когда трогали права.
blocks:
  доступ:
    title: Права, роли, видимость и границы доступа
    members:
      [
        PRB-ROLE-REVOCATION,
        DBT-INVARIANTS,
        DBT-RLS,
        DBT-ACCESS-PATHS,
        DBT-PROJECT-ACCESS,
        DBT-PROJECT-ACCESS-DIRECTORY,
        DBT-STAFF-CAPABILITIES,
        DBT-PROJECT-VIEWS,
        UNIT-CORE-SECURITY,
        UNIT-PKG-CONTRACTS-VISIBILITY,
        CHK-FILE-ACCESS,
        CHK-TESTING-SESSIONS,
        SMK-PROJECT-ACCESS,
        SMK-ADMIN-ROLES,
      ]

  вход:
    title: Вход, сессии, восстановление доступа
    members:
      [
        PRB-TOKEN-REVOCATION,
        PRB-SERVICE-TOKEN-EPOCH,
        PRB-CSRF-BINDING,
        UNIT-PKG-API-CLIENT-CLIENT,
        DBT-INVARIANTS,
        UNIT-CORE-VERIFICATION,
        SMK-AUTH-RECOVERY,
        SMK-CORE,
        RND-AUTH,
        CHK-PROFILE-API,
        RND-PROFILE,
      ]

  проект:
    title: Проект, видимость и материалы (кабинет основателя)
    members:
      [
        PRB-UPLOAD-QUOTA,
        PRB-UPLOAD-COMPLETION,
        PRB-UPLOAD-CANCEL,
        RND-UPLOAD-OPERATIONS,
        PRB-REQUEST-KEYS,
        RND-GUARDED-SEND,
        UNIT-PKG-CABINET-GUARDED-SEND,
        DBT-OPERATIONS,
