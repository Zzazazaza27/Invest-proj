requirements:
  # ------------------------------------------------------------ доступ и роли
  - id: ACC-RLS-001
    title: Политики RLS покрывают каждую доменную таблицу, и покрытие нельзя потерять молча
    area: доступ
    severity: critical
    rationale: >-
      Таблица без политики открыта всем, у кого есть роль приложения. Новая
      таблица без записи в манифесте — самый дешёвый способ открыть данные.
    checks: [DBT-RLS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity:
      status: verified
      method: >-
        манифест краснел при добавлении identity.user_avatars (M125) и схемы
        testing (M129) — оба раза до внесения в список
      date: 2026-09-21
      commit: c219a96
    runPolicy: ci

  - id: ACC-RLS-002
    title: Основатель, инвестор и эксперт не видят чужих проектов, договоров и рецензий
    area: доступ
    severity: critical
    rationale: Изоляция участников — основное обещание платформы инвесторам и основателям.
    checks: [DBT-RLS, SMK-PROJECT-ACCESS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: ACC-ADMIN-001
    title: Административные маршруты закрыты для всех, кроме администратора
    area: доступ
    severity: critical
    rationale: Раздел «Пользователи» раскрывает контакты и позволяет блокировать людей.
    checks: [CHK-ADMIN-USERS-API, RND-STAFF-ACCESS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: ACC-CAP-001
    title: Полномочия сотрудника ограничивают действия, а роль администратора проходит их неявно
    area: доступ
    severity: high
    rationale: >-
      Модель M097: администратор проходит все полномочия. Полномочие
      ограничивает сотрудника с частичными правами — и это должно оставаться
      правдой при каждом новом полномочии.
    checks: [DBT-STAFF-CAPABILITIES, RND-STAFF-ACCESS]
    confirmation: reviewed-in-code
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: ACC-CONTACT-001
    title: Контакты хранятся зашифрованными, показываются маской, раскрытие пишется в журнал
    area: доступ
    severity: critical
    rationale: Персональные данные; раскрытие без следа — нарушение и потеря доказуемости.
    checks: [CHK-ADMIN-USERS-API]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: ACC-CONSOLE-001
    title: Служебная консоль недоступна анониму и не-администратору
    area: доступ
    severity: critical
    rationale: Консоль выполняет служебные операции над данными.
    checks: [CHK-CONSOLE-PRIVATE, RND-CONSOLE]
    confirmation: reviewed-in-code
    sensitivity: { status: not-verified }
    runPolicy: handoff

  # ------------------------------------------------------------- авторизация
  - id: AUTH-001
    title: Вход, выход и восстановление пароля работают обычным путём
    area: авторизация
    severity: critical
    rationale: Без входа платформа недоступна целиком.
    checks: [RND-AUTH, SMK-AUTH-RECOVERY]
    confirmation: reviewed-in-code
    sensitivity: { status: not-verified }
    runPolicy: handoff
    limits: >-
      Механизм тестовых сессий эти проверки НЕ заменяет: переключение
      участника без пароля обычный вход не проверяет.

  - id: AUTH-002
    title: Выход и отзыв прав прекращают доступ немедленно, а не по истечении токена
    area: авторизация
    severity: critical
    rationale: Рубеж сессий (M035) и реестр отзыва (M038) — защита от украденной cookie.
    checks: [PRB-TOKEN-REVOCATION, PRB-ROLE-REVOCATION, CHK-TESTING-SESSIONS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: AUTH-003
    title: CSRF-защита не ослабляется ни одним режимом работы
    area: авторизация
    severity: critical
    rationale: Двойная отправка токена — единственная преграда межсайтовому действию.
    checks: [CHK-TESTING-SESSIONS, PRB-CSRF-BINDING]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  # ------------------------------------------------- тестовые сессии и просмотр
  - id: TST-CTX-001
    title: >-
      Контекст доступа действует только для своего инициатора и только внутри
      его административной сессии
    area: тестовые сессии
    severity: critical
    rationale: >-
      Подстановка личности — самая опасная операция в системе. Ошибка здесь
      означает чтение чужого кабинета.
    checks: [CHK-TESTING-SESSIONS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity:
      status: not-verified
      note: негативный контроль не проводился — требует изоляции
    runPolicy: handoff

  - id: TST-CTX-002
    title: Негодный, чужой или отозванный контекст даёт отказ, а не права администратора
    area: тестовые сессии
    severity: critical
    rationale: Тихий возврат к личности инициатора — скрытая эскалация прав.
    checks: [CHK-TESTING-SESSIONS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: TST-CTX-003
    title: Режим просмотра запрещает изменения на сервере, включая неявные
    area: тестовые сессии
    severity: critical
    rationale: >-
      Плашка «только чтение» без серверного запрета — обещание, а не
      ограничение. Изменения бывают неявные (отметка уведомления прочитанным).
    checks: [CHK-TESTING-SESSIONS, RND-TESTING-SESSIONS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: TST-CTX-004
    title: Режим просмотра всегда виден, а выход из него один
    area: тестовые сессии
    severity: high
    rationale: >-
      Вкладка в режиме просмотра без плашки — худшее состояние: человек не
      знает, чьими глазами смотрит. Уход без завершения оставлял просмотр живым.
    checks: [RND-TESTING-SESSIONS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity:
      status: verified
      method: свойства найдены владельцем вручную, прогон написан по следам и краснел на прежнем поведении
      date: 2026-09-22
      commit: 43ae5cb
    runPolicy: handoff

  - id: TST-CLEAN-001
    title: >-
      Уборка сессии удаляет только созданное ею и никогда — общие справочники,
      подготовленное содержимое и рабочие записи
    area: тестовые сессии
    severity: critical
    rationale: Уборка по признаку «похоже на тестовое» однажды унесёт нужное.
    checks: [CHK-TESTING-SESSIONS, RND-TESTING-SESSIONS, DBT-DATA-CLASSES]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity: { status: not-verified }
    runPolicy: handoff

  - id: TST-CLEAN-002
    title: Рабочий пользователь не может стать участником тестовой сессии
    area: тестовые сессии
    severity: critical
    rationale: Иначе уборка сессии дотянется до живого человека.
    checks: [CHK-TESTING-SESSIONS]
    confirmation: confirmed-by-run
    confirmedOn: 2026-09-22
    sensitivity:
