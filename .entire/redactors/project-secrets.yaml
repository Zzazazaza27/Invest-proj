# Назначение: этот пак редактирует секреты платформы в транскриптах сессий и
# метаданных чекпоинтов ДО того, как они попадут в git-объекты.
#
# Повод: 2026-08-12 ветка entire/checkpoints/v1 унесла в git ключевой материал
# KEK_KYC_DOCUMENTS, KEK_PASSPORT_SENSITIVE и KEK_NOMINAL_ACCOUNT_EVIDENCE —
# секрет-гейт дал 75 находок. Встроенный детектор Entire их пропустил: пятый
# проход («bounded credential value») знает только типовые имена
# DB_PASSWORD / PGPASSWORD / MYSQL_PWD / REDIS_PASSWORD / MONGO_PASSWORD,
# а KEK_* в этот список не входит.
#
# ПРАВИЛО ВЕДЕНИЯ: реальных значений секретов здесь быть не должно — файл
# коммитится. Только имена переменных и формы значений. Значения в samples —
# синтетические.
#
# Синтаксис — Go/RE2: lookaround и обратные ссылки НЕ поддерживаются.
# Совпадение заменяется на литерал REDACTED. Поле samples — исполняемая
# самопроверка правила: input с redacted:false обязан НЕ совпадать.
#
# Общая форма правил на присваивание:
#   ИМЯ  ["']?[ \t]{0,4}[:=][ \t]{0,4}["']?  ЗНАЧЕНИЕ
# Разделитель требует настоящий оператор [:=] — иначе он глотает `_` внутри
# самого имени переменной и первое попавшееся слово после него, и правило
# срабатывает на упоминании имени в обычном тексте.
# Одинарная кавычка записана как \x27, чтобы не экранировать её в YAML.
#
# Перередактировать лишнее безопасно, недоредактировать — нет: правила
# намеренно шире необходимого.
name: project-secrets
version: 1.0.0
description: Ключевой материал и учётные данные платформы Пятый элемент
rules:
  # --- Ключи шифрования документов (прямая причина утечки 2026-08-12) --------
  - id: kek-assignment
    description: Присваивание любого KEK_* — имя ключа рядом со значением
    regex: 'KEK_[A-Z0-9_]{2,}["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{16,}'
    samples:
      - { input: 'KEK_KYC_DOCUMENTS=SAMPLE_NOT_A_REAL_KEY_VALUE_0000', redacted: true }
      - { input: 'KEK_PASSPORT_SENSITIVE: SAMPLE_NOT_A_REAL_KEY_VALUE', redacted: true }
      - { input: '"KEK_KYB_DOCUMENTS": "SAMPLE_NOT_A_REAL_KEY_VALUE"', redacted: true }
      - { input: 'export KEK_SEARCH_INDEX=SAMPLE_NOT_A_REAL_KEY_VALUE', redacted: true }
      - { input: 'KEK_NOMINAL_ACCOUNT_EVIDENCE not set', redacted: false }
      - { input: 'ротация KEK_PASSPORT_SENSITIVE запланирована', redacted: false }

  - id: kek-bare-32byte-base64
    description: Голое значение 32-байтового ключа в base64 (43 символа + паддинг)
    regex: '[A-Za-z0-9+/]{43}='
    samples:
      - { input: 'SAMPLEnotAREALkeyVALUEforTESTSonlyPADDING00=', redacted: true }
      - { input: 'короткая строка base64 AAAA=', redacted: false }

  - id: bare-high-entropy-run
    description: >-
      Голый ключевой материал от 43 символов — base64url, hex, беспаддинговые
      токены. Символы / и . намеренно исключены из класса, иначе правило съедает
      пути к файлам, а они в транскрипте как раз полезны.
    regex: '[A-Za-z0-9_-]{43,}'
    samples:
      - { input: 'SAMPLE_NOT_A_REAL_HIGH_ENTROPY_RUN_FOR_TESTS_ONLY', redacted: true }
      - { input: 'packages/core/src/modules/compliance/application/service.ts', redacted: false }
      - { input: 'обычный текст без длинных случайных строк', redacted: false }

  # --- Учётные данные -------------------------------------------------------
  - id: password-assignment
    description: Присваивание любой переменной, в имени которой есть PASSWORD
    regex: '[A-Z0-9_]*PASSWORD[A-Z0-9_]*["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{6,}'
    samples:
      - { input: 'DB_ROLE_PASSWORD_APP_AUTH=sample-not-a-real-password', redacted: true }
      - { input: 'POSTGRES_PASSWORD: sample-not-a-real-password', redacted: true }
      - { input: 'KEYCLOAK_ADMIN_PASSWORD is required', redacted: false }

  - id: signing-key-assignment
    description: Ключи подписи — CSRF, локальная авторизация, интеграционные токены
    regex: '[A-Z0-9_]*SIGNING_KEY["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{8,}'
    samples:
      - { input: 'CSRF_SIGNING_KEY=sample-not-a-real-signing-key-value', redacted: true }
      - { input: 'LOCAL_AUTH_SIGNING_KEY: sample-not-a-real-signing-key', redacted: true }
      - { input: 'INTEGRATION_TOKEN_SIGNING_KEY missing', redacted: false }

  - id: secret-assignment
    description: Присваивание любой переменной, в имени которой есть SECRET
    regex: '[A-Z0-9_]*SECRET[A-Z0-9_]*["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{6,}'
    samples:
      - { input: 'PAYMENT_PROVIDER_WEBHOOK_SECRET=sample-not-real', redacted: true }
      - { input: 'S3_SECRET_ACCESS_KEY: sample-not-a-real-access-key', redacted: true }
      - { input: 'OIDC_CLIENT_SECRET undefined', redacted: false }

  - id: token-assignment
    description: Присваивание любой переменной, в имени которой есть TOKEN
    regex: '[A-Z0-9_]*TOKEN[A-Z0-9_]*["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{12,}'
    samples:
      - { input: 'AI_GATEWAY_TOKEN=SAMPLE_NOT_A_REAL_TOKEN_VALUE', redacted: true }
      - { input: 'TELEGRAM_BOT_TOKEN empty', redacted: false }

  - id: access-key-assignment
    description: Идентификаторы и ключи доступа к объектному хранилищу
    regex: '[A-Z0-9_]*ACCESS_KEY[A-Z0-9_]*["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{8,}'
    samples:
      - { input: 'S3_ACCESS_KEY_ID=sample-not-real-id', redacted: true }
      - { input: 'S3_ACCESS_KEY_ID rotated', redacted: false }

  - id: root-user-assignment
    description: Учётные данные администратора MinIO и Keycloak
    regex: '(MINIO_ROOT|KEYCLOAK_ADMIN)[A-Z0-9_]*["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.-]{6,}'
    samples:
      - { input: 'MINIO_ROOT_USER=sample-not-real', redacted: true }
      - { input: 'KEYCLOAK_ADMIN=sample-admin-name', redacted: true }
      - { input: 'MINIO_ROOT_USER unset', redacted: false }

  # --- Строки подключения ---------------------------------------------------
  # Встроенный детектор Entire уже покрывает credentialed URI и DSN; правила
  # оставлены как второй рубеж на случай нестандартной формы записи.
  - id: database-url-assignment
    description: Присваивание DATABASE_URL и его ролевых вариантов
    regex: 'DATABASE_URL[A-Z0-9_]*["\x27]?[ \t]{0,4}[:=][ \t]{0,4}["\x27]?[A-Za-z0-9+/=_.:@-]{12,}'
    samples:
      - { input: 'DATABASE_URL_APP_AUTH=postgres://user:sample@localhost:5432/db', redacted: true }
      - { input: 'DATABASE_URL_TEST not configured', redacted: false }

  - id: credentialed-uri
    description: Любой URI со встроенными учётными данными user:pass@host
    regex: '[a-z][a-z0-9+.-]{1,15}://[^\s:@/]{1,64}:[^\s:@/]{1,128}@'
    samples:
      - { input: 'redis://default:sample-not-real@127.0.0.1:6379/0', redacted: true }
      - { input: 'https://docs.entire.io/security', redacted: false }
