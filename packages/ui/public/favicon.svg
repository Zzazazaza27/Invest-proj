<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Значок вкладки — та же плитка, что и в шапке кабинетов (IconTile
    variant="solid" с иконкой rocket): фирменный градиент, скругление 32% от
    стороны, белая ракета в половину плитки. Рисуется здесь отдельным файлом,
    а не берётся из `icons.tsx`: браузер запрашивает favicon до загрузки
    бандла, и React к этому моменту ещё не существует.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5330e8" />
      <stop offset="1" stop-color="#7c3ff2" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="20.5" fill="url(#brand)" />
  <!--
    Иконка вписана как в плитке: сторона 32 (половина от 64) в центре, поэтому
    сетка 24×24 сдвигается на 16 и растягивается в 32/24. Толщина штриха 1.75
    задана в исходных единицах и масштабируется вместе с ним
    (vector-effect здесь не нужен — пропорции сохранены).
  -->
  <g
    transform="translate(16 16) scale(1.3333)"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M12 2.8c2.6 2.4 4 5.6 4 9.1v2.6l-1.6 1.6H9.6L8 14.5v-2.6c0-3.5 1.4-6.7 4-9.1Z"
      fill="#ffffff"
      fill-opacity=".14"
      stroke="none"
    />
    <path d="M12 2.8c2.6 2.4 4 5.6 4 9.1v2.6l-1.6 1.6H9.6L8 14.5v-2.6c0-3.5 1.4-6.7 4-9.1Z" />
    <circle cx="12" cy="9.6" r="1.7" />
    <path d="M8 11.4 5.4 14v3.4L8 15.6M16 11.4 18.6 14v3.4L16 15.6" />
    <path d="M10.4 18.4c0 1 1.6 2.8 1.6 2.8s1.6-1.8 1.6-2.8" />
  </g>
</svg>
